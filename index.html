<title>Commons Fridge · Functional Prototype v1.4</title>
<style>:root{
  --paper:#f3f0e7;
  --card:#fffdf6;
  --ink:#26302b;
  --muted:#667069;
  --sage:#506b5b;
  --sage-soft:#dfe8df;
  --amber:#d89245;
  --amber-soft:#f5e5ce;
  --danger:#8d3f35;
  --line:2px solid var(--ink);
  --shadow:7px 8px 0 #c7c8bd;
}
*{box-sizing:border-box}
html{min-height:100%;background:#d9ddd6;color:var(--ink)}
body{margin:0;min-height:100%;padding:62px 18px 26px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;background:linear-gradient(150deg,#e8ebe5 0 48%,#d6ddd6 48% 100%);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button,a{touch-action:manipulation}
button{min-height:46px;border:var(--line);border-radius:9px 12px 8px 11px;background:var(--sage);color:white;padding:10px 14px;font-weight:720;cursor:pointer;transition:transform 120ms ease,background 120ms ease,box-shadow 120ms ease}
button:hover{background:#3f594a;box-shadow:2px 3px 0 #bbc2b9}
button:active{transform:translateY(1px);box-shadow:none}
button.secondary{background:transparent;color:var(--ink);border-color:#68736c}
button.secondary:hover{background:var(--sage-soft)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
button.danger:hover{background:#f5e3df}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #176bb3;outline-offset:3px}
h1,h2,h3,p{overflow-wrap:anywhere}
h1{font-size:clamp(30px,7vw,42px);line-height:1.04;letter-spacing:-.035em;margin:10px 0 16px}
h2{font-size:clamp(24px,5.5vw,32px);line-height:1.12;letter-spacing:-.025em;margin:7px 0 13px}
h3{font-size:17px;margin:0}
p{margin:7px 0 15px}
.prototype-disclosure{position:fixed;z-index:10;inset:0 0 auto;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px dashed #6a756e;background:rgba(243,240,231,.97);font-size:11px;letter-spacing:.055em;text-align:center}
.prototype-disclosure span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sage)}
.device-shell{width:min(100%,460px);min-height:780px;margin:0 auto;border:3px solid var(--ink);border-radius:29px 24px 31px 25px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 13px;border-bottom:1px dashed #aeb6af;background:rgba(255,253,246,.95)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand span:last-child{display:grid}
.brand small{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--sage)}
.brand strong{font-size:15px}
.fridge-mark{position:relative;width:29px;height:35px;border:2px solid var(--ink);border-radius:5px 4px 6px 5px;background:var(--paper)}
.fridge-mark:after{content:"";position:absolute;left:0;right:0;top:12px;border-top:2px solid var(--ink)}
.fridge-mark i{position:absolute;right:5px;top:5px;height:5px;border-left:2px solid var(--sage)}
.icon-button{width:46px;min-width:46px;padding:7px;text-align:center;background:transparent;color:var(--ink);font-size:23px}
.app-surface{flex:1;padding:25px 22px 28px;animation:surface-in 220ms ease-out}
.scope-footer{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:11px 14px;border-top:1px dashed #aeb6af;color:var(--muted);font-size:11px;text-align:center}
.kicker{margin:0;color:var(--sage);font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
.lede{color:var(--muted);font-size:15px;max-width:36ch}
.route-grid{display:grid;gap:12px;margin:25px 0 20px}
.route-card{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:13px;min-height:104px;border:var(--line);border-radius:14px 10px 16px 11px;padding:13px;background:var(--paper);color:var(--ink);text-decoration:none;transition:transform 130ms ease,background 130ms ease}
.route-card:nth-child(2){transform:rotate(-.25deg)}
.route-card:hover{background:var(--sage-soft);transform:translateY(-2px)}
.route-card b{display:block;font-size:17px}
.route-card small{display:block;margin-top:3px;color:var(--muted)}
.route-card .arrow{font-size:22px;color:var(--sage)}
.route-icon{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;background:var(--card);font-size:22px}
.boundary-note{border-left:4px solid var(--amber);background:var(--amber-soft);padding:11px 12px;font-size:13px;color:#5d4a33}
.field{display:block;margin:18px 0 0;font-size:13px;font-weight:760}
.field input{width:100%;min-height:48px;margin-top:7px;border:var(--line);border-radius:8px 11px 7px 10px;background:white;padding:10px 12px}
.option-list{display:grid;gap:9px;margin:9px 0 19px}
.option-button{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;color:var(--ink);text-align:left}
.option-button[aria-pressed="true"]{background:var(--ink);color:white}
.option-button[aria-pressed="true"]:after{content:"✓"}
.step-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font-size:12px}
.step-label strong{color:var(--sage)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.actions.single{grid-template-columns:1fr}
.back-link{display:inline-flex;align-items:center;gap:5px;min-height:44px;margin-bottom:7px;color:var(--sage);font-weight:720;text-decoration-thickness:1px;text-underline-offset:4px}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:18px 0;padding:3px;border:2px solid var(--ink);border-radius:11px}
.segmented button{min-height:40px;padding:6px 4px;border-color:transparent;background:transparent;color:var(--ink);font-size:12px;text-align:center}
.segmented button[aria-pressed="true"]{background:var(--ink);color:white}
.item-list{display:grid;gap:12px}
.item-card{position:relative;border:2px solid #667069;border-radius:11px 14px 9px 13px;background:white;padding:14px}
.item-card:nth-child(even){transform:rotate(.2deg)}
.item-card p{margin:5px 0 10px;color:var(--muted);font-size:13px}
.item-meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;border:1px solid var(--sage);border-radius:99px;padding:2px 8px;background:var(--sage-soft);color:#355044;font-size:10px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.card-actions button{min-height:42px;font-size:12px}
.empty-state{border:2px dashed #97a199;border-radius:12px;padding:28px 14px;text-align:center;color:var(--muted)}
.edit-panel,.confirm-panel{margin-top:12px;border:2px dashed var(--sage);border-radius:12px;padding:12px;background:var(--sage-soft)}
.edit-panel select{width:100%;min-height:44px;margin:7px 0 10px;border:2px solid var(--ink);border-radius:8px;background:white;padding:8px}
.checkbox-row{display:flex;align-items:center;gap:9px;min-height:44px;font-size:13px;font-weight:650}
.checkbox-row input{width:20px;height:20px}
.toast{position:fixed;z-index:20;left:50%;bottom:22px;max-width:min(90vw,420px);transform:translate(-50%,16px);border:2px solid var(--ink);border-radius:9px;background:var(--ink);color:white;padding:10px 14px;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 160ms ease;box-shadow:3px 4px 0 rgba(0,0,0,.16)}
.toast.is-visible{opacity:1;transform:translate(-50%,0)}
@keyframes surface-in{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
.mascot{display:block;width:100%;height:100%;background-repeat:no-repeat;background-position:center bottom;background-size:contain}

.route-icon{width:62px;height:62px;padding:3px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);overflow:hidden}
.route-card{grid-template-columns:64px 1fr auto}
.view-mascot{display:flex;align-items:flex-end;gap:12px;margin:2px 0 4px}
.view-mascot .figure{width:76px;height:76px;flex:none}
.view-mascot p{margin:0 0 6px;color:var(--muted);font-size:13px;max-width:26ch}
.empty-state .figure{width:96px;height:96px;margin:0 auto 10px}
@media(max-width:360px){.route-card{grid-template-columns:54px 1fr}.route-icon{width:54px;height:54px}}
@media(prefers-reduced-motion:no-preference){
  .route-card:hover .mascot{transform:translateY(-2px) rotate(-1.5deg);transition:transform 160ms ease}
}
@media(max-width:600px){
  body{padding:38px 0 0;background:var(--card)}
  .device-shell{width:100%;min-height:calc(100vh - 38px);border:0;border-radius:0;box-shadow:none}
  .app-surface{padding:22px 18px calc(30px + env(safe-area-inset-bottom))}
  .route-card{min-height:96px}
}
@media(max-width:360px){
  .actions,.card-actions{grid-template-columns:1fr}
  .route-card{grid-template-columns:44px 1fr}.route-card .arrow{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .route-card:nth-child(2),.item-card:nth-child(even){transform:none}
}

/* ---------- v1.2 新增 ---------- */

/* 描述字段头：步骤勾 + 字数 */
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.counter{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.step-done{display:inline-block;margin-right:5px;color:var(--sage);font-weight:800}

/* 常放的东西：一键填入，替代打字 */
.quick-label{margin:13px 0 7px;color:var(--muted);font-size:12px}
.quick-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.quick-pick{min-height:38px;padding:6px 12px;border:2px solid #68736c;border-radius:99px;
  background:transparent;color:var(--ink);font-size:13px;font-weight:640}
.quick-pick:hover{background:var(--sage-soft);border-color:var(--sage)}

/* 未填完时保存按钮降一档，但仍可点——点了会给出具体提示并把焦点送过去 */
button.is-waiting{background:#8d9a91}
button.is-waiting:hover{background:#7c8a81}

/* 单选语义换成 aria-checked 后，选中态跟着改 */
.option-button[aria-checked="true"]{background:var(--ink);color:white}
.option-button[aria-checked="true"]:after{content:"✓"}
.segmented button[aria-checked="true"]{background:var(--ink);color:white}

/* 卡片说明只出现一次，不再每张卡重复 */
.card-note{margin:0 0 11px;color:var(--muted);font-size:12px}
.item-card h3{margin-bottom:9px}

/* 提醒状态用形态区分，不只靠文字 */
.chip-off{border-style:dashed;background:transparent;color:var(--muted)}

@media(max-width:360px){
  .quick-pick{font-size:12px;padding:5px 10px}
}


/* ==================== v1.4 ==================== */

/* 过滤器由三列变四列 */
.segmented.four{grid-template-columns:repeat(4,1fr)}
.segmented.four button{font-size:11px;padding:6px 2px}
.segmented.three{grid-template-columns:repeat(3,1fr);margin:0}

/* ---- 公地块：企鹅 + 状态行 + 鱼 ---- */
.commons-block{border-left:4px solid var(--amber);background:var(--amber-soft);
  border-radius:0 8px 8px 0;padding:11px 13px;margin:16px 0}
.commons-head{display:flex;align-items:center;gap:12px}
.commons-head .figure{width:58px;height:50px;flex:none}
.commons-line{margin:0;font-size:13.5px;font-weight:640;color:#5d4a33;line-height:1.5}
.fish-row{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.fish-count{font-size:11.5px;font-weight:620;color:#7a5520}

/* ---- 鱼 ---- */

/* ---- 计划状态：形态 + 颜色双重编码 ---- */
.item-card{overflow:hidden;padding-left:16px}
.plan-bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
.plan-bar.is-overdue{width:9px}
.chip-plan{font-size:10px}
.chip-plan.is-quiet{border-style:dashed;border-color:#8d968f;background:transparent;color:var(--muted)}
.chip-plan.is-ontrack{border-color:var(--sage);background:transparent;color:var(--sage)}
.chip-plan.is-midway,.chip-plan.is-overdue{border-color:var(--amber);background:var(--amber-soft);color:#7a5520}
.fish-invite{display:flex;align-items:center;gap:6px;margin:8px 0 0;
  font-size:11.5px;color:#8a7a63;line-height:1.4}

/* ---- 批量录入 ---- */
.quick-pick.is-other{border-style:dashed;color:var(--sage);border-color:var(--sage)}
.other-panel{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;
  padding:12px;margin:14px 0 0;background:var(--paper)}
.other-panel .field{margin-top:0}
.batch-count{display:flex;align-items:center;gap:9px;margin:18px 0 9px;
  font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.batch-count:after{content:"";flex:1;border-top:1px dashed #aeb6af}
.batch-empty{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;padding:22px 14px;
  margin:18px 0 0;background:var(--paper);color:var(--muted);font-size:13px;text-align:center}
.draft-list{display:grid;gap:8px}
.draft-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  border:2px solid #667069;border-radius:9px 12px 8px 11px;background:white;padding:9px 10px}
.draft-row .grip{color:var(--muted);font-size:13px}
.draft-body{display:grid;gap:5px}
.draft-name{font-weight:720;font-size:14px}
.draft-selects{display:flex;gap:5px;flex-wrap:wrap}
button.mini{min-height:0;padding:2px 8px;border:1.5px solid #8d968f;border-radius:6px;
  background:var(--paper);color:var(--muted);font-size:11px;font-weight:600}
button.mini.is-set,button.mini[data-action="row-ownership"]{border-color:var(--ink);color:var(--ink);font-weight:720}
button.mini.is-open{border-style:dashed}
button.row-remove{min-height:0;width:30px;padding:2px;border:none;background:transparent;
  color:var(--muted);font-size:15px}
button.row-remove:hover{background:transparent;color:var(--danger)}
.batch-default{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;
  padding:11px;margin:16px 0 0;background:var(--paper)}
.batch-default-label{margin:0 0 8px;font-size:11.5px;font-weight:720;color:var(--muted)}
.batch-default .segmented{border-width:2px}

@media (max-width:380px){
  .commons-head .figure{width:46px;height:40px}
  .segmented.four button{font-size:10px}
}

/* 免责条是 position:fixed；英文比中文长，务必给它留够高度，否则会盖住 app-header */
.prototype-disclosure{line-height:1.45}
@media (max-width:420px){body{padding-top:70px}}

/* Commons Fridge · Functional Prototype v1.4
 *
 * 语言无关的应用逻辑。所有面向用户的文字都来自构建时注入的 T（strings.json）。
 *
 * v1.4 的核心改动：系统盯的对象从「食物」换成「用户自己声明的计划」。
 * 因此没有保质期、没有食品安全判断、没有定时器、没有通知。
 * 状态由纯函数按当前时间计算，永不写回存储。
 */

const STORAGE_KEY = 'commons-fridge-functional-v1';
const FISH_KEY = 'commons-fridge-functional-v1-fish';
const MAX_DESCRIPTION = 42;
const DAY_MS = 86400000;

const OWNERSHIP_KEYS = ['personal', 'shared', 'ask'];
const PLAN_KEYS = ['soon', 'week', 'open'];
const PLAN_DAYS = { soon: 3, week: 7, open: null };
const MIDWAY_RATIO = 0.65;
const STATE_ORDER = { overdue: 0, midway: 1, ontrack: 2, quiet: 3 };
const FISH_RECENT_MS = 2 * DAY_MS;

/* v1.0 / v1.1 把英文显示文案直接存进了 localStorage。
   保留这张映射表，旧数据才不会在升级后丢失。 */
const LEGACY_OWNERSHIP = {
  Personal: 'personal',
  'Shared with house': 'shared',
  'Ask first': 'ask'
};

const app = document.getElementById('app');
const toast = document.getElementById('toast');
let toastTimer = 0;
let storageRecovered = false;
let draftCounter = 0;

/* ---------- 归一化与迁移 ---------- */

function normaliseOwnership(value) {
  if (OWNERSHIP_KEYS.includes(value)) return value;
  if (LEGACY_OWNERSHIP[value]) return LEGACY_OWNERSHIP[value];
  return 'personal';
}

/* 同时吃 v1.4 的 plan 与 v1.0/v1.2 的 review。
   v1.0 存字符串 'Review soon' / null；v1.2 存布尔。 */
function normalisePlan(value) {
  if (PLAN_KEYS.includes(value)) return value;
  if (value === true || value === 'Review soon') return 'soon';
  return 'open';
}

/* 旧数据没有时间戳。设为「迁移这一刻」而不是某个过去时间——
   倒推会让用户升级后凭空看到一堆 overdue，那是系统制造的指责。 */
function normalisePlanSetAt(value, plan, now) {
  if (plan === 'open') return null;
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? new Date(parsed).toISOString() : new Date(now).toISOString();
}

function initialItems() {
  const now = Date.now();
  return T.demoItems.map((item, index) => ({
    id: `demo-${index}`,
    description: item.description,
    ownership: normaliseOwnership(item.ownership),
    plan: normalisePlan(item.plan),
    /* 演示数据按 ageDays 回拨，否则展台上永远只看得到 ontrack，
       整个机制在现场不可见。 */
    planSetAt: item.ageDays == null ? null : new Date(now - item.ageDays * DAY_MS).toISOString()
  }));
}

function loadItems() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return initialItems();
  const now = Date.now();
  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) throw new Error('items must be an array');
    return parsed.map((item) => {
      const plan = normalisePlan(item.plan !== undefined ? item.plan : item.review);
      return {
        id: String(item.id),
        description: String(item.description).slice(0, MAX_DESCRIPTION),
        ownership: normaliseOwnership(item.ownership),
        plan,
        planSetAt: normalisePlanSetAt(item.planSetAt, plan, now)
      };
    });
  } catch (error) {
    localStorage.removeItem(STORAGE_KEY);
    storageRecovered = true;
    return initialItems();
  }
}

function loadFish() {
  const saved = localStorage.getItem(FISH_KEY);
  if (!saved) return { count: Number(T.demoFish) || 0, last: new Date().toISOString() };
  try {
    const parsed = JSON.parse(saved);
    const count = Number(parsed.count);
    return { count: Number.isFinite(count) && count >= 0 ? count : 0, last: parsed.last || null };
  } catch (error) {
    localStorage.removeItem(FISH_KEY);
    return { count: 0, last: null };
  }
}

/* ---------- 状态：纯函数，不写回存储 ---------- */

function planState(item, now) {
  if (item.plan === 'open' || !item.planSetAt) return 'quiet';
  const days = PLAN_DAYS[item.plan];
  if (!days) return 'quiet';
  const start = Date.parse(item.planSetAt);
  if (!Number.isFinite(start)) return 'quiet';
  const ratio = (now - start) / (days * DAY_MS);
  if (ratio >= 1) return 'overdue';
  if (ratio >= MIDWAY_RATIO) return 'midway';
  return 'ontrack';
}

function needsAttention(item, now) {
  const s = planState(item, now);
  return s === 'midway' || s === 'overdue';
}

function sortedItems(items, now) {
  return items
    .map((item, index) => ({ item, index, order: STATE_ORDER[planState(item, now)] }))
    .sort((a, b) => (a.order - b.order) || (a.index - b.index))
    .map((entry) => entry.item);
}

function attentionCount(items, now) {
  return items.filter((item) => needsAttention(item, now)).length;
}

/* 优先级：需要注意 > 最近有人照看 > 平静。
   企鹅永不低于基线——没有难过、没有生病、没有被冷落。 */
function penguinFace(items, now) {
  if (attentionCount(items, now) > 0) return 'alert';
  const last = state.fish.last ? Date.parse(state.fish.last) : NaN;
  if (state.fish.count > 0 && Number.isFinite(last) && now - last < FISH_RECENT_MS) return 'lively';
  return 'calm';
}

/* ---------- state ---------- */

const state = {
  items: loadItems(),
  fish: loadFish(),
  draft: [],
  batchDefault: 'personal',
  otherOpen: false,
  otherText: '',
  filter: 'all',
  editingId: null,
  pendingClearId: null
};

function saveItems() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
}

function saveFish() {
  localStorage.setItem(FISH_KEY, JSON.stringify(state.fish));
}

function getRoute() {
  if (window.location.hash === '#add') return 'add';
  if (window.location.hash === '#manage') return 'manage';
  return 'home';
}

function escapeHTML(value) {
  return String(value).replace(/[&<>'"]/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[character]);
}

function plural(one, many, n) {
  return n === 1 ? one : many.replace('{n}', n);
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('is-visible');
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 3200);
}

/* ---------- home ---------- */

function homeView() {
  return `
    <p class="kicker">${T.home.kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.home.title}</h1>
    <p class="lede">${T.home.lede}</p>
    <div class="route-grid">
      <a class="route-card" href="#add">
        <span class="route-icon"><span class="mascot m-add" aria-hidden="true"></span></span>
        <span><b>${T.home.addTitle}</b><small>${T.home.addSub}</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="route-card" href="#manage">
        <span class="route-icon"><span class="mascot m-alert" aria-hidden="true"></span></span>
        <span><b>${T.home.manageTitle}</b><small>${T.home.manageSub}</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <p class="boundary-note">${T.home.boundary}</p>`;
}

/* ---------- add：批量录入 ---------- */

function nextOwnership() {
  const last = state.draft[state.draft.length - 1];
  return last ? last.ownership : state.batchDefault;
}

function addDraft(description) {
  const text = String(description).trim().slice(0, MAX_DESCRIPTION);
  if (!text) { showToast(T.toast.needDescription); return false; }
  state.draft.push({
    tmpId: `d-${draftCounter++}`,
    description: text,
    ownership: nextOwnership(),
    plan: 'open'
  });
  return true;
}

function cycle(list, current) {
  return list[(list.indexOf(current) + 1) % list.length];
}

function quickPicks() {
  const picks = T.add.quickPicks.map((label) => `
    <button type="button" class="quick-pick" data-action="quick-add" data-value="${escapeHTML(label)}">
      ${escapeHTML(label)}
    </button>`).join('');
  return picks + `
    <button type="button" class="quick-pick is-other" data-action="other-toggle"
            aria-expanded="${state.otherOpen}">${T.add.otherLabel}</button>`;
}

function otherPanel() {
  if (!state.otherOpen) return '';
  return `
    <div class="other-panel">
      <label class="field" for="other-input">
        <span class="field-head">
          <span>${T.add.otherPlaceholder}</span>
          <span class="counter" aria-hidden="true">${T.add.counter.replace('{n}', state.otherText.length).replace('{max}', MAX_DESCRIPTION)}</span>
        </span>
        <input id="other-input" type="text" maxlength="${MAX_DESCRIPTION}" autocomplete="off"
               value="${escapeHTML(state.otherText)}" placeholder="${escapeHTML(T.add.otherPlaceholder)}">
      </label>
      <div class="actions">
        <button type="button" data-action="other-commit">${T.add.otherCommit}</button>
        <button type="button" class="secondary" data-action="other-cancel">${T.add.otherCancel}</button>
      </div>
    </div>`;
}

function draftRow(row) {
  return `
    <div class="draft-row">
      <span class="grip" aria-hidden="true">☰</span>
      <span class="draft-body">
        <span class="draft-name">${escapeHTML(row.description)}</span>
        <span class="draft-selects">
          <button type="button" class="mini" data-action="row-ownership" data-value="${row.tmpId}">
            ${T.ownership[row.ownership]} <span aria-hidden="true">▾</span>
          </button>
          <button type="button" class="mini ${row.plan === 'open' ? 'is-open' : 'is-set'}"
                  data-action="row-plan" data-value="${row.tmpId}">
            ${T.plan[row.plan]} <span aria-hidden="true">▾</span>
          </button>
        </span>
      </span>
      <button type="button" class="row-remove" data-action="row-remove" data-value="${row.tmpId}"
              aria-label="${T.add.remove}">✕</button>
    </div>`;
}

function batchDefaults() {
  return OWNERSHIP_KEYS.map((key) => `
    <button type="button" role="radio" data-action="batch-default" data-value="${key}"
            aria-checked="${state.batchDefault === key}">${T.ownership[key]}</button>`).join('');
}

function addView() {
  const n = state.draft.length;
  return `
    <a class="back-link" href="#home">${T.add.back}</a>
    <p class="kicker">${T.add.kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.add.title}</h1>
    <p class="lede">${T.add.lede}</p>
    <div class="view-mascot">
      <span class="figure mascot m-add" role="img" aria-label="${T.add.mascotLine}"></span>
      <p>${T.add.mascotLine}</p>
    </div>

    <p class="quick-label">${T.add.quickLabel}</p>
    <div class="quick-row">${quickPicks()}</div>
    ${otherPanel()}

    ${n ? `<p class="batch-count">${plural(T.add.batchCountOne, T.add.batchCountMany, n)}</p>
    <div class="draft-list">${state.draft.map(draftRow).join('')}</div>

    <div class="batch-default">
      <p class="batch-default-label">${T.add.batchDefault}</p>
      <div class="segmented three" role="radiogroup" aria-label="${T.add.batchDefault}">${batchDefaults()}</div>
    </div>

    <div class="actions single">
      <button type="button" data-action="save-batch">${plural(T.add.saveOne, T.add.saveMany, n)}</button>
    </div>`
    : `<div class="batch-empty">${T.add.emptyHint}</div>`}`;
}

/* ---------- manage ---------- */

function filteredItems(now) {
  const sorted = sortedItems(state.items, now);
  if (state.filter === 'personal') return sorted.filter((item) => item.ownership !== 'shared');
  if (state.filter === 'shared') return sorted.filter((item) => item.ownership === 'shared');
  if (state.filter === 'soon') return sorted.filter((item) => item.plan === 'soon');
  return sorted;
}

function editPanel(item) {
  if (state.editingId !== item.id) return '';
  const owners = OWNERSHIP_KEYS.map((key) =>
    `<option value="${key}" ${item.ownership === key ? 'selected' : ''}>${T.ownership[key]}</option>`).join('');
  const plans = PLAN_KEYS.map((key) =>
    `<option value="${key}" ${item.plan === key ? 'selected' : ''}>${T.plan[key]}</option>`).join('');
  return `
    <div class="edit-panel">
      <label class="field">${T.manage.editOwnership}
        <select data-edit-ownership="${escapeHTML(item.id)}">${owners}</select>
      </label>
      <label class="field">${T.manage.editPlan}
        <select data-edit-plan="${escapeHTML(item.id)}">${plans}</select>
      </label>
      <div class="actions">
        <button type="button" data-action="update-item" data-value="${escapeHTML(item.id)}">${T.manage.saveUpdate}</button>
        <button type="button" class="secondary" data-action="cancel-update">${T.manage.cancel}</button>
      </div>
    </div>`;
}

function clearPanel(item) {
  if (state.pendingClearId !== item.id) return '';
  return `
    <div class="confirm-panel" role="alert">
      <strong>${T.manage.clearTitle}</strong>
      <p>${T.manage.clearBody}</p>
      <div class="actions">
        <button type="button" class="danger" data-action="confirm-clear" data-value="${escapeHTML(item.id)}">${T.manage.clearConfirm}</button>
        <button type="button" class="secondary" data-action="cancel-clear">${T.manage.clearCancel}</button>
      </div>
    </div>`;
}

function itemCard(item, now) {
  const s = planState(item, now);
  const bar = (s === 'midway' || s === 'overdue')
    ? `<span class="plan-bar${s === 'overdue' ? ' is-overdue' : ''}" aria-hidden="true"></span>` : '';
  const invite = (s === 'midway' || s === 'overdue')
    ? `<p class="fish-invite"><span class="fish fish-outline" aria-hidden="true"></span>${T.manage.fishInvite}</p>` : '';
  return `
    <article class="item-card state-${s}">
      ${bar}
      <h3>${escapeHTML(item.description)}</h3>
      <div class="item-meta">
        <span class="chip">${T.ownership[item.ownership]}</span>
        <span class="chip chip-plan is-${s}">${T.plan[item.plan]}</span>
      </div>
      ${invite}
      <div class="card-actions">
        <button type="button" class="secondary" data-action="edit-item" data-value="${escapeHTML(item.id)}">${T.manage.edit}</button>
        <button type="button" class="danger" data-action="clear-item" data-value="${escapeHTML(item.id)}">${T.manage.clear}</button>
      </div>
      ${editPanel(item)}
      ${clearPanel(item)}
    </article>`;
}

/* 企鹅 + 状态行 + 鱼。主语永远是计划或食物，永远不是人。
   0 件时整块消失——不写「一切正常」，系统安静时应当真的安静。 */
function commonsBlock(now) {
  const attention = attentionCount(state.items, now);
  const fish = state.fish.count;
  if (!attention && !fish) return '';
  const face = penguinFace(state.items, now);
  const line = attention
    ? `<p class="commons-line">${plural(T.manage.statusOne, T.manage.statusMany, attention)}</p>` : '';
  const fishRow = fish
    ? `<div class="fish-row">${'<span class="fish fish-solid" aria-hidden="true"></span>'.repeat(Math.min(fish, 5))}
        <span class="fish-count">${plural(T.manage.rescuedOne, T.manage.rescuedMany, fish)}</span></div>` : '';
  return `
    <div class="commons-block">
      <div class="commons-head">
        <span class="figure mascot m-${face}" role="img" aria-label="${T.manage.mascotLine}"></span>
        ${line}
      </div>
      ${fishRow}
    </div>`;
}

function manageView() {
  const now = Date.now();
  const items = filteredItems(now);
  const seg = [
    ['all', T.manage.filterAll],
    ['personal', T.manage.filterPersonal],
    ['shared', T.manage.filterShared],
    ['soon', T.manage.filterSoon]
  ].map(([key, label]) => `
    <button type="button" role="radio" data-action="set-filter" data-value="${key}"
            aria-checked="${state.filter === key}">${label}</button>`).join('');

  const empty = `<div class="empty-state">
      <span class="figure mascot m-calm" aria-hidden="true"></span>
      <strong>${T.manage.emptyTitle}</strong>
      <p>${T.manage.emptyBody}</p>
      <a class="back-link" href="#add">${T.manage.emptyLink}</a>
    </div>`;

  return `
    <a class="back-link" href="#home">${T.manage.back}</a>
    <p class="kicker">${T.manage.kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.manage.title}</h1>
    ${commonsBlock(now)}
    <div class="segmented four" role="radiogroup" aria-label="${T.manage.filterLabel}">${seg}</div>
    ${items.length ? `<p class="card-note">${T.manage.cardNote}</p>` : ''}
    <div class="item-list">${items.length ? items.map((item) => itemCard(item, now)).join('') : empty}</div>`;
}

/* ---------- render ---------- */

function render({ focusHeading = false } = {}) {
  const route = getRoute();
  app.innerHTML = route === 'add' ? addView() : route === 'manage' ? manageView() : homeView();
  if (focusHeading) document.getElementById('route-title')?.focus({ preventScroll: true });
}

function resetDemo() {
  if (!window.confirm(T.reset.confirm)) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(FISH_KEY);
  state.items = initialItems();
  state.fish = loadFish();
  state.draft = [];
  state.batchDefault = 'personal';
  state.otherOpen = false;
  state.otherText = '';
  state.filter = 'all';
  state.editingId = null;
  state.pendingClearId = null;
  render();
  showToast(T.reset.done);
}

/* ---------- actions ---------- */

function handleAction(action, value) {
  if (action === 'quick-add') { if (addDraft(value)) render(); return; }

  if (action === 'other-toggle') {
    state.otherOpen = !state.otherOpen;
    render();
    if (state.otherOpen) document.getElementById('other-input')?.focus();
    return;
  }
  if (action === 'other-commit') {
    if (addDraft(state.otherText)) { state.otherText = ''; render(); document.getElementById('other-input')?.focus(); }
    return;
  }
  if (action === 'other-cancel') { state.otherOpen = false; state.otherText = ''; render(); return; }

  if (action === 'row-remove') {
    state.draft = state.draft.filter((row) => row.tmpId !== value);
    render();
    showToast(T.toast.rowRemoved);
    return;
  }
  if (action === 'row-ownership') {
    const row = state.draft.find((candidate) => candidate.tmpId === value);
    if (row) { row.ownership = cycle(OWNERSHIP_KEYS, row.ownership); render(); }
    return;
  }
  if (action === 'row-plan') {
    const row = state.draft.find((candidate) => candidate.tmpId === value);
    if (row) { row.plan = cycle(PLAN_KEYS, row.plan); render(); }
    return;
  }
  if (action === 'batch-default') {
    state.batchDefault = value;
    state.draft.forEach((row) => { row.ownership = value; });
    render();
    return;
  }

  if (action === 'save-batch') {
    if (!state.draft.length) return;
    const now = Date.now();
    const stamp = new Date(now).toISOString();
    /* 新录入排在前面：刚放进去的最容易需要确认。
       id 带索引，避免同一毫秒内批量保存产生重复。 */
    const fresh = state.draft.map((row, index) => ({
      id: `item-${now}-${index}`,
      description: row.description,
      ownership: row.ownership,
      plan: row.plan,
      planSetAt: row.plan === 'open' ? null : stamp
    }));
    const n = fresh.length;
    state.items = fresh.concat(state.items);
    state.draft = [];
    state.otherOpen = false;
    state.otherText = '';
    saveItems();
    window.location.hash = '#manage';
    showToast(plural(T.toast.savedOne, T.toast.savedMany, n));
    return;
  }

  if (action === 'set-filter') { state.filter = value; render(); return; }
  if (action === 'edit-item') { state.editingId = value; state.pendingClearId = null; render(); return; }
  if (action === 'cancel-update') { state.editingId = null; render(); return; }

  if (action === 'update-item') {
    const item = state.items.find((candidate) => candidate.id === value);
    if (!item) return;
    const owner = document.querySelector(`[data-edit-ownership="${CSS.escape(value)}"]`);
    const plan = document.querySelector(`[data-edit-plan="${CSS.escape(value)}"]`);
    item.ownership = normaliseOwnership(owner.value);
    const nextPlan = normalisePlan(plan.value);
    /* 改档＝用户重新承诺一次，计时从头开始。 */
    if (nextPlan !== item.plan) {
      item.plan = nextPlan;
      item.planSetAt = nextPlan === 'open' ? null : new Date().toISOString();
    }
    state.editingId = null;
    saveItems();
    render();
    showToast(T.toast.updated);
    return;
  }

  if (action === 'clear-item') { state.pendingClearId = value; state.editingId = null; render(); return; }
  if (action === 'cancel-clear') { state.pendingClearId = null; render(); return; }

  if (action === 'confirm-clear') {
    const now = Date.now();
    const item = state.items.find((candidate) => candidate.id === value);
    /* 鱼 ＝ 被救下来的食物。谁处理的都算，不分归属。
       计划还没过大半就清掉的，不算「救」，也不扣任何东西。 */
    const earned = item ? needsAttention(item, now) : false;
    state.items = state.items.filter((candidate) => candidate.id !== value);
    state.pendingClearId = null;
    saveItems();
    if (earned) {
      state.fish.count += 1;
      state.fish.last = new Date(now).toISOString();
      saveFish();
    }
    render();
    showToast(earned ? T.toast.fishEarned : T.toast.cleared);
    return;
  }

  if (action === 'reset-demo') resetDemo();
}

document.addEventListener('input', (event) => {
  if (event.target.id === 'other-input') {
    state.otherText = event.target.value;
    const counter = app.querySelector('.other-panel .counter');
    if (counter) {
      counter.textContent = T.add.counter
        .replace('{n}', state.otherText.length)
        .replace('{max}', MAX_DESCRIPTION);
    }
  }
});

document.addEventListener('keydown', (event) => {
  if (event.target.id === 'other-input' && event.key === 'Enter') {
    event.preventDefault();
    handleAction('other-commit', '');
  }
});

document.addEventListener('click', (event) => {
  const control = event.target.closest('[data-action]');
  if (!control) return;
  handleAction(control.dataset.action, control.dataset.value || '');
});

window.addEventListener('hashchange', () => render({ focusHeading: true }));
render();
if (storageRecovered) showToast(T.toast.recovered);
</script>
</body>
</html>
