<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='4' fill='%23f3f0e7' stroke='%2326302b' stroke-width='2'/%3E%3Cpath d='M5 12h22M22 6v3M22 16v5' stroke='%23506b5b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Commons Fridge</title>
<style>:root{
  --paper:#f3f0e7;
  --card:#fffdf6;
  --ink:#26302b;
  --muted:#667069;
  --sage:#506b5b;
  --sage-soft:#dfe8df;
  --amber:#d89245;
  --amber-soft:#f5e5ce;
  --danger:#8d3f35;
  --line:2px solid var(--ink);
  --shadow:7px 8px 0 #c7c8bd;
}
*{box-sizing:border-box}
html{min-height:100%;background:#d9ddd6;color:var(--ink)}
body{margin:0;min-height:100%;padding:62px 18px 26px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;background:linear-gradient(150deg,#e8ebe5 0 48%,#d6ddd6 48% 100%);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button,a{touch-action:manipulation}
button{min-height:46px;border:var(--line);border-radius:9px 12px 8px 11px;background:var(--sage);color:white;padding:10px 14px;font-weight:720;cursor:pointer;transition:transform 120ms ease,background 120ms ease,box-shadow 120ms ease}
button:hover{background:#3f594a;box-shadow:2px 3px 0 #bbc2b9}
button:active{transform:translateY(1px);box-shadow:none}
button.secondary{background:transparent;color:var(--ink);border-color:#68736c}
button.secondary:hover{background:var(--sage-soft)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
button.danger:hover{background:#f5e3df}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #176bb3;outline-offset:3px}
h1,h2,h3,p{overflow-wrap:anywhere}
h1{font-size:clamp(30px,7vw,42px);line-height:1.04;letter-spacing:-.035em;margin:10px 0 16px}
h2{font-size:clamp(24px,5.5vw,32px);line-height:1.12;letter-spacing:-.025em;margin:7px 0 13px}
h3{font-size:17px;margin:0}
p{margin:7px 0 15px}
.prototype-disclosure{position:fixed;z-index:10;inset:0 0 auto;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px dashed #6a756e;background:rgba(243,240,231,.97);font-size:11px;letter-spacing:.055em;text-align:center}
.prototype-disclosure span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sage)}
.device-shell{width:min(100%,460px);min-height:780px;margin:0 auto;border:3px solid var(--ink);border-radius:29px 24px 31px 25px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 13px;border-bottom:1px dashed #aeb6af;background:rgba(255,253,246,.95)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand span:last-child{display:grid}
.brand small{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--sage)}
.brand strong{font-size:15px}
.fridge-mark{position:relative;width:29px;height:35px;border:2px solid var(--ink);border-radius:5px 4px 6px 5px;background:var(--paper)}
.fridge-mark:after{content:"";position:absolute;left:0;right:0;top:12px;border-top:2px solid var(--ink)}
.fridge-mark i{position:absolute;right:5px;top:5px;height:5px;border-left:2px solid var(--sage)}
.icon-button{width:46px;min-width:46px;padding:7px;text-align:center;background:transparent;color:var(--ink);font-size:23px}
.app-surface{flex:1;padding:25px 22px 28px;animation:surface-in 220ms ease-out}
.scope-footer{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:11px 14px;border-top:1px dashed #aeb6af;color:var(--muted);font-size:11px;text-align:center}
.kicker{margin:0;color:var(--sage);font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
.lede{color:var(--muted);font-size:15px;max-width:36ch}
.route-grid{display:grid;gap:12px;margin:25px 0 20px}
.route-card{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:13px;min-height:104px;border:var(--line);border-radius:14px 10px 16px 11px;padding:13px;background:var(--paper);color:var(--ink);text-decoration:none;transition:transform 130ms ease,background 130ms ease}
.route-card:nth-child(2){transform:rotate(-.25deg)}
.route-card:hover{background:var(--sage-soft);transform:translateY(-2px)}
.route-card b{display:block;font-size:17px}
.route-card small{display:block;margin-top:3px;color:var(--muted)}
.route-card .arrow{font-size:22px;color:var(--sage)}
.route-icon{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;background:var(--card);font-size:22px}
.boundary-note{border-left:4px solid var(--amber);background:var(--amber-soft);padding:11px 12px;font-size:13px;color:#5d4a33}
.field{display:block;margin:18px 0 0;font-size:13px;font-weight:760}
.field input{width:100%;min-height:48px;margin-top:7px;border:var(--line);border-radius:8px 11px 7px 10px;background:white;padding:10px 12px}
.option-list{display:grid;gap:9px;margin:9px 0 19px}
.option-button{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;color:var(--ink);text-align:left}
.option-button[aria-pressed="true"]{background:var(--ink);color:white}
.option-button[aria-pressed="true"]:after{content:"✓"}
.step-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font-size:12px}
.step-label strong{color:var(--sage)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.actions.single{grid-template-columns:1fr}
.back-link{display:inline-flex;align-items:center;gap:5px;min-height:44px;margin-bottom:7px;color:var(--sage);font-weight:720;text-decoration-thickness:1px;text-underline-offset:4px}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:18px 0;padding:3px;border:2px solid var(--ink);border-radius:11px}
.segmented button{min-height:40px;padding:6px 4px;border-color:transparent;background:transparent;color:var(--ink);font-size:12px;text-align:center}
.segmented button[aria-pressed="true"]{background:var(--ink);color:white}
.item-list{display:grid;gap:12px}
.item-card{position:relative;border:2px solid #667069;border-radius:11px 14px 9px 13px;background:white;padding:14px}
.item-card:nth-child(even){transform:rotate(.2deg)}
.item-card p{margin:5px 0 10px;color:var(--muted);font-size:13px}
.item-meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;border:1px solid var(--sage);border-radius:99px;padding:2px 8px;background:var(--sage-soft);color:#355044;font-size:10px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.card-actions button{min-height:42px;font-size:12px}
.empty-state{border:2px dashed #97a199;border-radius:12px;padding:28px 14px;text-align:center;color:var(--muted)}
.edit-panel,.confirm-panel{margin-top:12px;border:2px dashed var(--sage);border-radius:12px;padding:12px;background:var(--sage-soft)}
.edit-panel select{width:100%;min-height:44px;margin:7px 0 10px;border:2px solid var(--ink);border-radius:8px;background:white;padding:8px}
.checkbox-row{display:flex;align-items:center;gap:9px;min-height:44px;font-size:13px;font-weight:650}
.checkbox-row input{width:20px;height:20px}
.toast{position:fixed;z-index:20;left:50%;bottom:22px;max-width:min(90vw,420px);transform:translate(-50%,16px);border:2px solid var(--ink);border-radius:9px;background:var(--ink);color:white;padding:10px 14px;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 160ms ease;box-shadow:3px 4px 0 rgba(0,0,0,.16)}
.toast.is-visible{opacity:1;transform:translate(-50%,0)}
@keyframes surface-in{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
.mascot{display:block;width:100%;height:100%;background-repeat:no-repeat;background-position:center bottom;background-size:contain}

.route-icon{width:62px;height:62px;padding:3px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);overflow:hidden}
.route-card{grid-template-columns:64px 1fr auto}
.view-mascot{display:flex;align-items:flex-end;gap:12px;margin:2px 0 4px}
.view-mascot .figure{width:76px;height:76px;flex:none}
.view-mascot p{margin:0 0 6px;color:var(--muted);font-size:13px;max-width:26ch}
.empty-state .figure{width:96px;height:96px;margin:0 auto 10px}
@media(max-width:360px){.route-card{grid-template-columns:54px 1fr}.route-icon{width:54px;height:54px}}
@media(prefers-reduced-motion:no-preference){
  .route-card:hover .mascot{transform:translateY(-2px) rotate(-1.5deg);transition:transform 160ms ease}
}
@media(max-width:600px){
  body{padding:38px 0 0;background:var(--card)}
  .device-shell{width:100%;min-height:calc(100vh - 38px);border:0;border-radius:0;box-shadow:none}
  .app-surface{padding:22px 18px calc(30px + env(safe-area-inset-bottom))}
  .route-card{min-height:96px}
}
@media(max-width:360px){
  .actions,.card-actions{grid-template-columns:1fr}
  .route-card{grid-template-columns:44px 1fr}.route-card .arrow{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .route-card:nth-child(2),.item-card:nth-child(even){transform:none}
}

/* ---------- v1.2 新增 ---------- */

/* 描述字段头：步骤勾 + 字数 */
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.counter{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.step-done{display:inline-block;margin-right:5px;color:var(--sage);font-weight:800}

/* 常放的东西：一键填入，替代打字 */
.quick-label{margin:13px 0 7px;color:var(--muted);font-size:12px}
.quick-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.quick-pick{min-height:38px;padding:6px 12px;border:2px solid #68736c;border-radius:99px;
  background:transparent;color:var(--ink);font-size:13px;font-weight:640}
.quick-pick:hover{background:var(--sage-soft);border-color:var(--sage)}

/* 未填完时保存按钮降一档，但仍可点——点了会给出具体提示并把焦点送过去 */
button.is-waiting{background:#8d9a91}
button.is-waiting:hover{background:#7c8a81}

/* 单选语义换成 aria-checked 后，选中态跟着改 */
.option-button[aria-checked="true"]{background:var(--ink);color:white}
.option-button[aria-checked="true"]:after{content:"✓"}
.segmented button[aria-checked="true"]{background:var(--ink);color:white}

/* 卡片说明只出现一次，不再每张卡重复 */
.card-note{margin:0 0 11px;color:var(--muted);font-size:12px}
.item-card h3{margin-bottom:9px}

/* 提醒状态用形态区分，不只靠文字 */
.chip-off{border-style:dashed;background:transparent;color:var(--muted)}

@media(max-width:360px){
  .quick-pick{font-size:12px;padding:5px 10px}
}


/* ==================== v1.4 ==================== */

/* 过滤器由三列变四列 */
.segmented.four{grid-template-columns:repeat(4,1fr)}
.segmented.four button{font-size:11px;padding:6px 2px}
.segmented.three{grid-template-columns:repeat(3,1fr);margin:0}

/* ---- 公地块：企鹅 + 状态行 + 鱼 ---- */
.commons-block{border-left:4px solid var(--amber);background:var(--amber-soft);
  border-radius:0 8px 8px 0;padding:11px 13px;margin:16px 0}
.commons-head{display:flex;align-items:center;gap:12px}
.commons-head .figure{width:58px;height:50px;flex:none}
.commons-line{margin:0;font-size:13.5px;font-weight:640;color:#5d4a33;line-height:1.5}
.fish-row{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.fish-count{font-size:11.5px;font-weight:620;color:#7a5520}

/* ---- 鱼 ---- */

  background-repeat:no-repeat;background-position:center;background-size:contain}

/* ---- 计划状态：形态 + 颜色双重编码 ---- */
.item-card{overflow:hidden;padding-left:16px}
.plan-bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
.plan-bar.is-overdue{width:9px}
.chip-plan{font-size:10px}
.chip-plan.is-quiet{border-style:dashed;border-color:#8d968f;background:transparent;color:var(--muted)}
.chip-plan.is-ontrack{border-color:var(--sage);background:transparent;color:var(--sage)}
.chip-plan.is-midway,.chip-plan.is-overdue{border-color:var(--amber);background:var(--amber-soft);color:#7a5520}
.fish-invite{display:flex;align-items:center;gap:6px;margin:8px 0 0;
  font-size:11.5px;color:#8a7a63;line-height:1.4}

/* ---- 批量录入 ---- */
.quick-pick.is-other{border-style:dashed;color:var(--sage);border-color:var(--sage)}
.other-panel{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;
  padding:12px;margin:14px 0 0;background:var(--paper)}
.other-panel .field{margin-top:0}
.batch-count{display:flex;align-items:center;gap:9px;margin:18px 0 9px;
  font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.batch-count:after{content:"";flex:1;border-top:1px dashed #aeb6af}
.batch-empty{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;padding:22px 14px;
  margin:18px 0 0;background:var(--paper);color:var(--muted);font-size:13px;text-align:center}
.draft-list{display:grid;gap:8px}
.draft-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  border:2px solid #667069;border-radius:9px 12px 8px 11px;background:white;padding:9px 10px}
.draft-row .grip{color:var(--muted);font-size:13px}
.draft-body{display:grid;gap:5px}
.draft-name{font-weight:720;font-size:14px}
.draft-selects{display:flex;gap:5px;flex-wrap:wrap}
button.mini{min-height:0;padding:2px 8px;border:1.5px solid #8d968f;border-radius:6px;
  background:var(--paper);color:var(--muted);font-size:11px;font-weight:600}
button.mini.is-set,button.mini[data-action="row-ownership"]{border-color:var(--ink);color:var(--ink);font-weight:720}
button.mini.is-open{border-style:dashed}
button.row-remove{min-height:0;width:30px;padding:2px;border:none;background:transparent;
  color:var(--muted);font-size:15px}
button.row-remove:hover{background:transparent;color:var(--danger)}
.batch-default{border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;
  padding:11px;margin:16px 0 0;background:var(--paper)}
.batch-default-label{margin:0 0 8px;font-size:11.5px;font-weight:720;color:var(--muted)}
.batch-default .segmented{border-width:2px}

@media (max-width:380px){
  .commons-head .figure{width:46px;height:40px}
  .segmented.four button{font-size:10px}
}

/* 免责条是 position:fixed；英文比中文长，务必给它留够高度，否则会盖住 app-header */
.prototype-disclosure{line-height:1.45}
@media (max-width:420px){body{padding-top:70px}}


/* ==================== v1.5 ==================== */

.segmented.two{grid-template-columns:repeat(2,1fr)}
.segmented.scope{margin:16px 0 12px}
.segmented.four button{font-size:11px}

/* 屋内视图的常驻披露——不可折叠。系统没有的能力，界面不许暗示 */
.local-only{display:flex;align-items:flex-start;gap:9px;margin:0 0 14px;padding:10px 12px;
  border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;background:var(--paper);
  color:var(--muted);font-size:12px;line-height:1.5}
.local-only-mark{display:grid;place-items:center;width:18px;height:18px;flex:none;margin-top:1px;
  border:2px solid var(--muted);border-radius:50%;font-size:11px;font-weight:800}

/* 区域分组 */
.zone-group{margin:0 0 20px}
.zone-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 9px;
  padding-bottom:6px;border-bottom:2px solid var(--ink)}
.zone-name{font-size:15px;font-weight:800}
.zone-kind{font:700 9.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.zone-group .item-card{margin-bottom:10px}
.zone-group .item-card:last-child{margin-bottom:0}

/* unknown 归属：虚线 + muted，刻意不用 danger */
.chip-unknown{border-style:dashed;border-color:#8d968f;background:transparent;color:var(--muted)}
.chip-zone{border-color:#8d968f;background:var(--paper);color:var(--muted)}
.age-line{margin:7px 0 0;font:600 11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);font-variant-numeric:tabular-nums}
.opened-note{margin:6px 0 0;font-size:11px;color:var(--sage)}

/* 宽限期：整体降饱和 + 一条细边。主语永远是「有人」 */
.item-card.is-held{background:#f7f6f1;border-color:#98a29a}
.hold-row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;
  margin:9px 0 0;padding:8px 10px;border-left:3px solid var(--sage);background:var(--sage-soft);
  border-radius:0 8px 8px 0}
.hold-line{margin:0;font-size:12px;font-weight:640;color:#355044;line-height:1.4}
.hold-row button{min-height:32px;padding:4px 10px;font-size:11px}
button.danger.is-primary{background:var(--danger);color:white;border-color:var(--danger)}

/* 已处理回执：一行轻文字，48 小时后消失 */
.item-card.is-handled{background:var(--paper);border-style:dashed;border-color:#98a29a}
.handled-note{margin:6px 0 0;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.07em;color:var(--muted)}

/* 暂停 */
.plan-bar.is-paused{background:#c3cbc3;width:5px}
.pause-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0 0 14px;padding:11px 13px;border:2px dashed #8d968f;border-radius:9px 12px 8px 11px;
  background:var(--paper)}
.pause-banner p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.pause-banner button{min-height:36px;padding:6px 14px;font-size:12px}
.actions.away{margin-top:18px}

/* 混合区补归属 */
.mixed-nudge{display:block;width:100%;min-height:0;margin:6px 0 0;padding:8px 10px;
  border:2px dashed var(--amber);border-radius:8px;background:var(--amber-soft);
  color:#7a5520;font-size:11.5px;font-weight:640;text-align:left;line-height:1.45}
.mixed-nudge:hover{background:#f0dcc0}
.whose-panel{margin:6px 0 0;padding:10px;border:2px solid var(--ink);
  border-radius:9px 12px 8px 11px;background:var(--paper)}
.whose-hint{margin:0 0 8px;font-size:11.5px;color:var(--muted);line-height:1.45}
.whose-label{margin:0 0 7px;font-size:11.5px;font-weight:720}
.draft-row-wrap{display:block}
.draft-list{gap:10px}

.tag-new{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
  background:var(--sage);color:white;font:700 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;vertical-align:1px}

.found-note{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--sage);
  background:var(--sage-soft);border-radius:0 8px 8px 0;font-size:12px;color:#355044;line-height:1.5}
button.mini[disabled]{opacity:1;cursor:default;border-style:dashed}

@media (max-width:380px){
  .segmented.four button{font-size:9.5px}
  .zone-name{font-size:14px}
}

/* ==================== v1.6 ==================== */

/* 语言切换：紧挨复位按钮 */
.header-tools{display:flex;align-items:center;gap:8px}
.lang-button{width:auto;min-width:48px;padding:0 10px;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em}

/* 首页第三、四入口 */
.home-tools{margin-top:18px;text-align:center}
.text-link{color:var(--sage);font-size:12.5px;font-weight:700;text-decoration:underline}

/* F14 两组快速项 */
.quick-group-label{margin:16px 0 7px;font-size:12px;font-weight:720;color:var(--muted)}
.quick-group-label:first-of-type{margin-top:0}
.group-note{margin:14px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}

/* F8 开放取用 */
.chip-offer{border-color:var(--sage);background:var(--sage-soft);color:#355044}
.zone-group.is-offer .zone-head{border-bottom-color:var(--sage)}
.zone-group.is-offer .zone-name{color:var(--sage)}

/* F9 搬出交接 */
.moving-banner{margin:0 0 14px;padding:9px 12px;border-left:4px solid var(--sage);
  background:var(--sage-soft);border-radius:0 8px 8px 0;color:#355044;
  font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.pick-list{display:grid;gap:8px;margin:16px 0 0}
.pick-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;
  min-height:52px;padding:10px 12px;border:2px solid #667069;border-radius:9px 12px 8px 11px;
  background:white;color:var(--ink);text-align:left}
.pick-row.is-on{border-color:var(--ink);background:var(--sage-soft)}
.pick-box{display:grid;place-items:center;width:22px;height:22px;flex:none;
  border:2px solid var(--ink);border-radius:6px;background:white;font-size:13px;font-weight:800}
.pick-name{font-size:14px;font-weight:700}
.back-link.as-button{display:inline-block;min-height:0;padding:0;border:none;background:transparent}
.button-link{display:block;text-align:center;border:var(--line);border-radius:9px 12px 8px 11px;
  background:var(--sage);color:white;padding:12px;font-weight:720;font-size:15px;text-decoration:none}

/* F10 房屋设置 */
.zone-input{width:100%;min-height:40px;border:2px solid #8d968f;border-radius:8px;
  background:var(--paper);padding:8px 10px;font-size:14px;font-weight:700;color:var(--ink)}
.agreed-block{margin:18px 0 0;padding:12px 14px;border:2px dashed #8d968f;
  border-radius:9px 12px 8px 11px;background:var(--paper)}
.agreed-head{margin:0 0 7px;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.09em;text-transform:uppercase;color:var(--sage)}
.agreed-block ul{margin:0;padding-left:18px}
.agreed-block li{font-size:12.5px;color:var(--muted);line-height:1.6}

/* F13 买菜前看一眼 */
.shop-block{margin:20px 0 0}
.shop-head{margin:0 0 9px;padding-bottom:6px;border-bottom:2px solid var(--ink);font-size:15px;font-weight:800}
.shop-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 0;
  border-bottom:1px dashed #c3cbc3}
.shop-row:last-child{border-bottom:none}
.shop-name{flex:1;min-width:110px;font-size:14px;font-weight:700}
.shop-count{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  font-variant-numeric:tabular-nums}
.shop-row .age-line{margin:0}
.shop-empty{margin:0;padding:14px 0;color:var(--muted);font-size:13px}
.shop-note{margin:20px 0 0;padding:10px 12px;border-left:3px solid #8d968f;background:var(--paper);
  border-radius:0 8px 8px 0;font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- F15 位置照片 ----------
   屋里有两台冰箱时，「混合区」这个词答不出东西在哪。照片答得出。
   它只指位置：不做识别，也从不参与所有权或计划的判断。 */
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.photo-panel{margin:14px 0 4px;border:2px solid var(--ink);border-radius:12px;
  padding:12px;background:var(--paper)}
.photo-hint{margin:-2px 0 10px;color:var(--muted);font-size:11.5px;line-height:1.5}
.photo-note{margin:10px 0 0;color:var(--muted);font-size:11.5px;line-height:1.5}
.photo-preview{display:flex;align-items:flex-start;gap:11px}
.photo-preview-side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.photo-batch-note{color:var(--muted);font-size:11.5px;line-height:1.45}
.photo-preview-side button{min-height:40px;font-size:12px;align-self:flex-start}
.photo-thumb{padding:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;
  background:var(--paper);line-height:0;flex:none;cursor:zoom-in;
  box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.photo-thumb img{display:block;width:104px;height:104px;object-fit:cover}
.card-photo{margin:9px 0 2px}
.card-photo .photo-thumb img{width:88px;height:88px}
/* 空位不是装饰，是把代价说出来：别人知道有这件东西，不知道去哪找。 */
.photo-slot{display:flex;align-items:center;gap:9px;width:100%;margin:9px 0 2px;
  border:2px dashed var(--sage);border-radius:11px;background:var(--sage-soft);
  padding:9px 11px;min-height:52px;text-align:left;font:inherit;color:var(--muted);
  font-size:11.5px;line-height:1.4;cursor:pointer}
.photo-slot-mark{flex:none;width:26px;height:22px;border:2px solid var(--sage);border-radius:5px;
  position:relative;background:var(--paper)}
.photo-slot-mark::after{content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:9px;height:9px;border:2px solid var(--sage);border-radius:50%}
.photo-slot-text{flex:1;min-width:0}
.photo-slot-cta{flex:none;font-weight:680;color:var(--ink);text-decoration:underline}
.photo-edit-label{margin:2px 0 0;font-size:12px;font-weight:650}
.photo-viewer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:20px;
  background:rgba(20,26,23,.86);cursor:zoom-out}
.photo-viewer img{max-width:100%;max-height:76vh;object-fit:contain;
  border:2px solid var(--paper);border-radius:12px;background:var(--paper)}
.photo-close{min-height:44px;padding:0 20px;border:2px solid var(--paper);border-radius:9px;
  background:var(--paper);color:var(--ink);font:inherit;font-weight:680;cursor:pointer}
@media (max-width:360px){
  .photo-thumb img{width:88px;height:88px}
  .card-photo .photo-thumb img{width:74px;height:74px}
  .photo-slot-cta{display:none}
}

/* 具体位置：跟着记录走的那半个「在哪」。区域 chip 说哪一区，它说哪一层、哪一台。 */
.spot-block{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed #b7bfb8}
.quick-pick.is-chosen{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.quick-pick.is-clear{border-style:dashed;color:var(--muted)}
.chip-spot{border-style:solid;background:var(--sage-soft);border-color:var(--sage);
  font-weight:650;position:relative;padding-left:22px}
.chip-spot::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;
  margin-top:-3px;border:2px solid var(--sage);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.spot-empty{margin:8px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45}
</style>
</head>

/* Commons Fridge · Functional Prototype v1.7
 *
 * v1.4：系统盯的是「用户自己声明的计划」。
 * v1.5：把「位置」补回来，让它同时承担所有权的载体与共享的面。
 * v1.6：补齐生命周期两端（冷冻 / 开放取用 / 搬出交接 / 入住设置 / 购物前查看），
 *       并把两套语言一起打包，运行时可切换——很多看这份原型的人是中文读者。
 * v1.7：把「在哪」补成两层。区域名说得出「哪一区」，说不出「哪台冰箱、哪一层」——
 *       屋里有两台冰箱时，文字位置基本等于没有位置。
 *       · 具体位置（spot）是**文字**，跟着记录走，任何人打开这条记录都看得到，
 *         这是「让别人知道去哪找」真正落地的那一半；
 *       · 位置照片是**精确指认**，但它只留在拍它的那台设备上（本版本不同步），
 *         所以它补的是精度，替不了上面那行字。
 *       照片由人自己拍、自己按下，只指位置，不做识别：
 *       它回答「在哪」，从不回答「这是什么、是谁的」。
 *
 * 状态仍是当前时间的纯函数，永不写回存储。没有定时器，没有通知，不在设备之间同步。
 */

const STORAGE_KEY = 'commons-fridge-functional-v1';
const FISH_KEY = 'commons-fridge-functional-v1-fish';
const ZONES_KEY = 'commons-fridge-functional-v1-zones';
const SETTINGS_KEY = 'commons-fridge-functional-v1-settings';
const LANG_KEY = 'commons-fridge-functional-v1-lang';
const MAX_DESCRIPTION = 42;
/* 640px 是「看得清哪一层、哪一台」与「localStorage 装得下」之间的折中：
   一张约 40–80 KB，5 MB 的配额够放几十张，装不下时按最早的先丢（见 saveItems）。 */
const MAX_PHOTO_EDGE = 640;
const PHOTO_QUALITY = 0.7;
const DAY_MS = 86400000;
const HOUR_MS = 3600000;

const OWNERSHIP_KEYS = ['personal', 'shared', 'ask', 'unknown'];
const PLAN_KEYS = ['soon', 'week', 'open'];
const ZONE_KINDS = ['own', 'mixed', 'cold'];
const PLAN_DAYS = { soon: 3, week: 7, open: null };
const MIDWAY_RATIO = 0.65;
const STATE_ORDER = { overdue: 0, midway: 1, ontrack: 2, quiet: 3, paused: 4 };
const FISH_RECENT_MS = 2 * DAY_MS;
const HOLD_MS = 48 * HOUR_MS;
const RECEIPT_MS = 48 * HOUR_MS;
const OFFER_ALWAYS = 'always';

const LEGACY_OWNERSHIP = { Personal: 'personal', 'Shared with house': 'shared', 'Ask first': 'ask' };

/* ---------- 语言：两套表一起打包，运行时切换 ---------- */

const LANGS = Object.keys(S);

function initialLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (LANGS.includes(saved)) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  return nav.indexOf('zh') === 0 && LANGS.includes('zh') ? 'zh' : LANGS[0];
}

let LANG = initialLang();
let T = S[LANG];

const app = document.getElementById('app');
const toast = document.getElementById('toast');
let toastTimer = 0;
let storageRecovered = false;
let draftCounter = 0;

/* ---------- 归一化与迁移 ---------- */

function normaliseOwnership(value) {
  if (OWNERSHIP_KEYS.includes(value)) return value;
  if (LEGACY_OWNERSHIP[value]) return LEGACY_OWNERSHIP[value];
  return 'personal';
}
function normalisePlan(value) {
  if (PLAN_KEYS.includes(value)) return value;
  if (value === true || value === 'Review soon') return 'soon';
  return 'open';
}
/* 旧数据没有时间戳。设为「迁移这一刻」而不是某个过去时间——
   倒推会让用户升级后凭空看到一堆 overdue，那是系统制造的指责。 */
function normalisePlanSetAt(value, plan, now) {
  if (plan === 'open') return null;
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? new Date(parsed).toISOString() : new Date(now).toISOString();
}
/* 只认本机 canvas 产出的 data URL。外部字符串（http、blob）一律丢弃：
   记录里永远不该出现一个「要去别处取」的图片地址。 */
/* 具体位置是文字，所以它是记录的一部分，会跟着记录走；照片不会。
   两者分工不同，缺了这一行，别人只知道「在门侧」，不知道哪一层、哪台。 */
function normaliseSpot(value) {
  const text = typeof value === 'string' ? value.trim().slice(0, MAX_DESCRIPTION) : '';
  return text || null;
}

function normalisePhoto(value) {
  return typeof value === 'string' && value.indexOf('data:image/') === 0 ? value : null;
}

function stamp(value) {
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? new Date(parsed).toISOString() : null;
}
function normaliseOffer(value) {
  if (value === OFFER_ALWAYS) return OFFER_ALWAYS;
  return stamp(value);
}

function loadZonesSeed() {
  return (T.demoZones || []).map((z) => ({ ...z, full: false, freeing: false }));
}

function loadZones() {
  const saved = localStorage.getItem(ZONES_KEY);
  const seed = loadZonesSeed;
  if (!saved) return seed();
  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) throw new Error('zones must be an array');
    return parsed.map((z) => ({
      id: String(z.id),
      kind: ZONE_KINDS.includes(z.kind) ? z.kind : 'own',
      label: String(z.label).slice(0, MAX_DESCRIPTION),
      full: z.full === true,
      freeing: z.freeing === true
    })).filter((z) => z.label);
  } catch (error) {
    localStorage.removeItem(ZONES_KEY);
    return seed();
  }
}

function loadSettings() {
  const fallback = { agreements: [false, false, false], setupDone: false, movingOut: false };
  const saved = localStorage.getItem(SETTINGS_KEY);
  if (!saved) return fallback;
  try {
    const parsed = JSON.parse(saved);
    const a = Array.isArray(parsed.agreements) ? parsed.agreements : [];
    return {
      agreements: [0, 1, 2].map((i) => a[i] === true),
      setupDone: parsed.setupDone === true,
      movingOut: parsed.movingOut === true
    };
  } catch (error) {
    localStorage.removeItem(SETTINGS_KEY);
    return fallback;
  }
}

function initialItems() {
  const now = Date.now();
  return T.demoItems.map((item, index) => {
    const base = item.ageDays == null ? null : new Date(now - item.ageDays * DAY_MS).toISOString();
    return {
      id: `demo-${index}`,
      description: item.description,
      ownership: normaliseOwnership(item.ownership),
      plan: normalisePlan(item.plan),
      /* 演示数据按 ageDays 回拨，否则展台上永远只看得到 ontrack，
         整个机制在现场不可见，也拍不出来。 */
      planSetAt: base,
      zone: item.zone || null,
      ageBase: base || new Date(now).toISOString(),
      openedAt: null, pausedAt: null, pausedMs: 0,
      holdUntil: null, handledAt: null, offerUntil: null,
      spot: normaliseSpot(item.spot),
      /* 演示数据永远不带照片：一张摆拍的冰箱内部图会被当成证据看。
         展台上留着空位反而更准——现场那台冰箱就在旁边，两秒就能拍一张真的。 */
      photo: null
    };
  });
}

function loadItems() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return initialItems();
  const now = Date.now();
  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) throw new Error('items must be an array');
    return parsed.map((item) => {
      const plan = normalisePlan(item.plan !== undefined ? item.plan : item.review);
      const planSetAt = normalisePlanSetAt(item.planSetAt, plan, now);
      const pausedMs = Number(item.pausedMs);
      return {
        id: String(item.id),
        description: String(item.description).slice(0, MAX_DESCRIPTION),
        ownership: normaliseOwnership(item.ownership),
        plan, planSetAt,
        zone: item.zone ? String(item.zone) : null,
        ageBase: stamp(item.ageBase) || planSetAt || new Date(now).toISOString(),
        openedAt: stamp(item.openedAt),
        pausedAt: stamp(item.pausedAt),
        pausedMs: Number.isFinite(pausedMs) && pausedMs >= 0 ? pausedMs : 0,
        holdUntil: stamp(item.holdUntil),
        handledAt: stamp(item.handledAt),
        offerUntil: normaliseOffer(item.offerUntil),
        spot: normaliseSpot(item.spot),
        photo: normalisePhoto(item.photo)
      };
    });
  } catch (error) {
    localStorage.removeItem(STORAGE_KEY);
    storageRecovered = true;
    return initialItems();
  }
}

function loadFish() {
  const saved = localStorage.getItem(FISH_KEY);
  if (!saved) return { count: Number(T.demoFish) || 0, last: new Date().toISOString() };
  try {
    const parsed = JSON.parse(saved);
    const count = Number(parsed.count);
    return { count: Number.isFinite(count) && count >= 0 ? count : 0, last: parsed.last || null };
  } catch (error) {
    localStorage.removeItem(FISH_KEY);
    return { count: 0, last: null };
  }
}

/* 压缩走 FileReader + Image + canvas，而不是 createImageBitmap——
   兼容性更好，旧 iPhone 的 Safari 也能用，而现场用的就是各人自己的手机。
   压完只留下 data URL：整条路径没有一次网络请求。 */
function readPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        const scale = Math.min(1, MAX_PHOTO_EDGE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- 状态：纯函数，不写回存储 ---------- */

function planState(item, now) {
  if (item.pausedAt) return 'paused';
  if (item.plan === 'open' || !item.planSetAt) return 'quiet';
  const days = PLAN_DAYS[item.plan];
  if (!days) return 'quiet';
  const start = Date.parse(item.planSetAt);
  if (!Number.isFinite(start)) return 'quiet';
  const elapsed = now - start - (item.pausedMs || 0);
  const ratio = elapsed / (days * DAY_MS);
  if (ratio >= 1) return 'overdue';
  if (ratio >= MIDWAY_RATIO) return 'midway';
  return 'ontrack';
}
function needsAttention(item, now) {
  const s = planState(item, now);
  return s === 'midway' || s === 'overdue';
}
function isHeld(item, now) { return !!item.holdUntil && Date.parse(item.holdUntil) > now; }
function holdHoursLeft(item, now) { return Math.max(1, Math.ceil((Date.parse(item.holdUntil) - now) / HOUR_MS)); }
function receiptVisible(item, now) { return !!item.handledAt && now - Date.parse(item.handledAt) < RECEIPT_MS; }
/* 时限走完悄悄回到原状——不发通知、不提示物主、不留记录。 */
function isOffered(item, now) {
  if (item.offerUntil === OFFER_ALWAYS) return true;
  return !!item.offerUntil && Date.parse(item.offerUntil) > now;
}
function offerLabel(item) {
  if (item.offerUntil === OFFER_ALWAYS) return T.manage.offerAlways;
  const left = Date.parse(item.offerUntil) - Date.now();
  return left > DAY_MS ? T.manage.offerTwoDays : T.manage.offerToday;
}
function ageDays(item, now) {
  const base = Date.parse(item.ageBase || item.planSetAt);
  if (!Number.isFinite(base)) return null;
  return Math.max(0, Math.floor((now - base) / DAY_MS));
}
function sortedItems(items, now) {
  return items
    .map((item, index) => ({ item, index, order: STATE_ORDER[planState(item, now)] }))
    .sort((a, b) => (a.order - b.order) || (a.index - b.index))
    .map((entry) => entry.item);
}
function attentionCount(items, now) { return items.filter((item) => needsAttention(item, now)).length; }
function penguinFace(items, now) {
  if (attentionCount(items, now) > 0) return 'alert';
  const last = state.fish.last ? Date.parse(state.fish.last) : NaN;
  if (state.fish.count > 0 && Number.isFinite(last) && now - last < FISH_RECENT_MS) return 'lively';
  return 'calm';
}

function kindCaption(kind) {

/* 照片是 data URL，是这份原型里唯一能把 localStorage 撑爆的东西。
   写不进去时不能连记录一起丢——从最早的一张开始丢照片，丢到写得进去为止。
   记录本身永远比照片重要，而且要如实告诉用户照片没留下。 */
function saveItems() {
  const write = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
  try { write(); return true; } catch (full) {
    if (!state.items.some((item) => item.photo)) throw full;
    for (let i = state.items.length - 1; i >= 0; i--) {
      if (!state.items[i].photo) continue;
      state.items[i].photo = null;
      try { write(); showToast(T.photo.tooLarge); return false; } catch (stillFull) { /* 再丢一张 */ }
    }
    write();                       // 照片全丢光还写不进去，就让错误照常抛出
    showToast(T.photo.tooLarge);
    return false;
  }
}

function saveZones() { localStorage.setItem(ZONES_KEY, JSON.stringify(state.zones)); }

}

function addDraft(description, found, plan) {
  const text = String(description).trim().slice(0, MAX_DESCRIPTION);
  if (!text) { showToast(T.toast.needDescription); return false; }
  const zone = found ? ((state.zones.find((z) => z.kind === 'mixed') || {}).id || nextZone()) : nextZone();
  const kind = zoneKind(zone);
  state.draft.push({
    tmpId: `d-${draftCounter++}`,
    description: text,
    /* 混合区从 unknown 起步（E15）；无主物入口锁定 unknown（F3）。 */
    ownership: found ? 'unknown' : (kind === 'mixed' ? 'unknown' : nextOwnership()),
    plan: kind === 'cold' ? 'open' : (plan || 'open'),
    zone: zone || null
  });
  return true;
}

    <div class="confirm-panel" role="alert">

      <p>${T.manage.clearBody}</p>
      <div class="actions">
        <button type="button" class="danger" data-action="confirm-clear" data-value="${escapeHTML(item.id)}">${T.manage.clearConfirm}</button>
        <button type="button" class="secondary" data-action="cancel-clear">${T.manage.clearCancel}</button>
      </div>
    </div>`;
}

function offerPanel(item) {
  if (state.offerFor !== item.id) return '';
  const opts = [['today', T.manage.offerToday], ['two', T.manage.offerTwoDays], [OFFER_ALWAYS, T.manage.offerAlways]];
  return `
    <div class="whose-panel">
      <p class="whose-label">${T.manage.offerPick}</p>
      <div class="segmented three" role="radiogroup" aria-label="${T.manage.offerPick}">
        ${opts.map(([k, l]) => `<button type="button" role="radio" data-action="offer-set"
          data-value="${escapeHTML(item.id)}:${k}" aria-checked="false">${l}</button>`).join('')}
      </div>
    </div>`;
}

/* 空位只给「不知道是谁的」那一类：那是别人真的会去找、却最不知道去哪找的东西。
   其余卡片的照片入口收在编辑面板里，免得动作行越排越长。 */
/* 位置 chip 紧跟区域 chip：区域说「哪一区」，它说「哪一层、哪一台」。 */
function cardSpot(item) {
  if (item.spot) {
    return `<span class="chip chip-spot">${escapeHTML(item.spot)}</span>`;
  }
  return '';
}

/* 无主物没写具体位置时，把代价说出来——这一条别人是要去找的。 */
function spotPrompt(item) {
  if (item.spot || item.ownership !== 'unknown') return '';
  return `<p class="spot-empty">${T.spot.emptyCard.replace('{zone}', escapeHTML(zoneLabel(item.zone)))}</p>`;
}

function cardPhoto(item) {
  const id = escapeHTML(item.id);
  if (item.photo) {
    return `<div class="card-photo">
      <button type="button" class="photo-thumb" data-action="photo-open" data-value="${id}"
              aria-label="${T.photo.cardOpen}"><img src="${item.photo}" alt="${T.photo.viewerAlt}"></button>
    </div>`;
  }
  if (item.ownership !== 'unknown') return '';
  return `<button type="button" class="photo-slot" data-action="photo-add" data-value="${id}">
    <span class="photo-slot-mark" aria-hidden="true"></span>
    <span class="photo-slot-text">${T.photo.emptySlot}</span>
    <span class="photo-slot-cta">${T.photo.cardAdd}</span></button>`;
}

function itemCard(item, now) {
  const s = planState(item, now);
  const held = isHeld(item, now);
  const offered = isOffered(item, now);
  const unknown = item.ownership === 'unknown';
  const id = escapeHTML(item.id);
  const cold = zoneKind(item.zone) === 'cold';

  if (receiptVisible(item, now)) {
    return `<article class="item-card is-handled"><h3>${escapeHTML(item.description)}</h3>
      <p class="handled-note">${T.manage.handled}</p></article>`;
  }

  const bar = (s === 'midway' || s === 'overdue')
    ? `<span class="plan-bar${s === 'overdue' ? ' is-overdue' : ''}" aria-hidden="true"></span>`
    : (s === 'paused' ? '<span class="plan-bar is-paused" aria-hidden="true"></span>' : '');
  const planChip = `${item.openedAt ? `${T.manage.opened} · ` : ''}${T.plan[item.plan]}${s === 'paused' ? ` · ${T.manage.pausedChip}` : ''}`;
  const days = ageDays(item, now);

  const invite = (s === 'midway' || s === 'overdue') && !held
    ? `<p class="fish-invite"><span class="fish fish-outline" aria-hidden="true"></span>${T.manage.fishInvite}</p>` : '';
  const holdRow = held ? `
    <div class="hold-row">
      <p class="hold-line">${plural(T.manage.holdOne, T.manage.holdMany, holdHoursLeft(item, now))}</p>
      <button type="button" class="secondary" data-action="release-hold" data-value="${id}">${T.manage.releaseHold}</button>
    </div>` : '';

  const canHold = (unknown || s === 'midway' || s === 'overdue') && !held;
  const holdDone = !!item.holdUntil && Date.parse(item.holdUntil) <= now;
  const actions = [
    unknown ? `<button type="button" class="secondary" data-action="claim-item" data-value="${id}">${T.manage.claim}</button>` : '',
    canHold ? `<button type="button" class="secondary" data-action="hold-item" data-value="${id}">${T.manage.hold}</button>` : '',
    (!unknown && !cold && s !== 'paused') ? `<button type="button" class="secondary" data-action="mark-opened" data-value="${id}">${T.manage.opened}</button>` : '',
    (!unknown && !cold && firstColdZone()) ? `<button type="button" class="secondary" data-action="to-freezer" data-value="${id}">${T.manage.toFreezer}</button>` : '',
    cold ? `<button type="button" class="secondary" data-action="thaw-item" data-value="${id}">${T.manage.thaw}</button>` : '',
    (!unknown && !offered) ? `<button type="button" class="secondary" data-action="offer-open" data-value="${id}">${T.manage.offer}</button>` : '',
    offered ? `<button type="button" class="secondary" data-action="offer-stop" data-value="${id}">${T.manage.offerStop}</button>` : '',
    s === 'paused' ? `<button type="button" class="secondary" data-action="resume-item" data-value="${id}">${T.manage.resumeOne}</button>` : '',
    `<button type="button" class="secondary" data-action="edit-item" data-value="${id}">${T.manage.edit}</button>`,
    `<button type="button" class="${holdDone ? 'danger is-primary' : 'danger'}" data-action="clear-item" data-value="${id}">${holdDone ? T.manage.handleNow : T.manage.clear}</button>`
  ].filter(Boolean).join('');

  return `
    <article class="item-card state-${s}${held ? ' is-held' : ''}">
      ${bar}
      <h3>${escapeHTML(item.description)}</h3>
      <div class="item-meta">
        <span class="chip${unknown ? ' chip-unknown' : ''}">${T.ownership[item.ownership]}</span>
        <span class="chip chip-plan is-${s}">${planChip}</span>
        ${item.zone ? `<span class="chip chip-zone">${escapeHTML(zoneLabel(item.zone))}</span>` : ''}
        ${cardSpot(item)}
        ${offered ? `<span class="chip chip-offer">${T.manage.offer} · ${offerLabel(item)}</span>` : ''}
      </div>
      ${spotPrompt(item)}
      ${cardPhoto(item)}
      ${days !== null ? `<p class="age-line">${plural(T.house.ageOne, T.house.ageMany, days)}</p>` : ''}
      ${item.openedAt ? `<p class="opened-note">${T.manage.openedNote}</p>` : ''}
      ${holdRow}${invite}
      <div class="card-actions">${actions}</div>
      ${offerPanel(item)}${editPanel(item)}${clearPanel(item)}
    </article>`;
}

function commonsBlock(now, list) {
  const attention = attentionCount(list, now);
  const fish = state.fish.count;
  const pausedAll = list.length > 0 && list.every((i) => i.pausedAt);
  if (!attention && !fish && !pausedAll) return '';
  const face = pausedAll ? 'calm' : penguinFace(list, now);
  const one = state.scope === 'house' ? T.house.statusOne : T.manage.statusOne;
  const many = state.scope === 'house' ? T.house.statusMany : T.manage.statusMany;
  const line = attention ? `<p class="commons-line">${plural(one, many, attention)}</p>`
    : (pausedAll ? `<p class="commons-line">${T.manage.nothingNow}</p>` : '');
  const fishRow = fish ? `<div class="fish-row">${'<span class="fish fish-solid" aria-hidden="true"></span>'.repeat(Math.min(fish, 5))}
      <span class="fish-count">${plural(T.manage.rescuedOne, T.manage.rescuedMany, fish)}</span></div>` : '';
  return `<div class="commons-block"><div class="commons-head">
      <span class="figure mascot m-${face}" role="img" aria-label="${T.manage.mascotLine}"></span>
      ${line}</div>${fishRow}</div>`;
}

function agreementsBlock() {
  const on = state.settings.agreements;
  if (!on.some(Boolean)) return '';
  const rows = [T.setup.agree1, T.setup.agree2, T.setup.agree3]
    .filter((_, i) => on[i]).map((t) => `<li>${t}</li>`).join('');
  return `<div class="agreed-block"><p class="agreed-head">${T.setup.agreedHead}</p><ul>${rows}</ul></div>`;
}

function manageView() {
  const now = Date.now();
  const inScope = scopeItems();
  const list = filterItems(inScope);
  const pausedAll = inScope.length > 0 && inScope.every((i) => i.pausedAt);
  const offered = state.scope === 'house' ? sortedItems(list.filter((i) => isOffered(i, now)), now) : [];
  const rest = list.filter((i) => offered.indexOf(i) === -1);

  const scopeToggle = `
    <div class="segmented two scope" role="radiogroup" aria-label="${T.house.scopeMine} / ${T.house.scopeHouse}">
      <button type="button" role="radio" data-action="set-scope" data-value="mine" aria-checked="${state.scope === 'mine'}">${T.house.scopeMine}</button>
      <button type="button" role="radio" data-action="set-scope" data-value="house" aria-checked="${state.scope === 'house'}">${T.house.scopeHouse}</button>
    </div>`;
  /* 屋内视图会让人以为数据在设备之间流动。它不流动——界面必须自己说出来。 */
  const disclosure = state.scope === 'house'
    ? `<p class="local-only" role="note"><span class="local-only-mark" aria-hidden="true">!</span>${T.house.localOnly}</p>` : '';
  const movingBanner = (state.scope === 'house' && state.settings.movingOut)
    ? `<p class="moving-banner">${T.moveOut.banner}</p>` : '';
  const pauseBanner = pausedAll ? `
    <div class="pause-banner"><p>${T.manage.pausedBanner}</p>
      <button type="button" data-action="resume-all">${T.manage.resumeAll}</button></div>` : '';
  const seg = [['all', T.manage.filterAll], ['personal', T.manage.filterPersonal],
               ['shared', T.manage.filterShared], ['soon', T.manage.filterSoon]]
    .map(([k, l]) => `<button type="button" role="radio" data-action="set-filter" data-value="${k}"
      aria-checked="${state.filter === k}">${l}</button>`).join('');
  const empty = `<div class="empty-state">
      <span class="figure mascot m-calm" aria-hidden="true"></span>
      <strong>${T.manage.emptyTitle}</strong><p>${T.manage.emptyBody}</p>
      <a class="back-link" href="#add">${T.manage.emptyLink}</a></div>`;

  let body;
  if (!list.length) body = empty;
  else if (state.scope === 'house') {
    const offerGroup = offered.length ? `
      <section class="zone-group is-offer">
        <h2 class="zone-head"><span class="zone-name">${T.manage.offerGroup}</span>
          <span class="zone-kind">${T.manage.offerGroupKind}</span></h2>
        ${offered.map((i) => itemCard(i, now)).join('')}</section>` : '';
    body = offerGroup + zoneGroups(rest, now).map((g) => `
      <section class="zone-group">
        <h2 class="zone-head">
          <span class="zone-name">${escapeHTML(g.zone ? g.zone.label : T.zone.none)}</span>
          <span class="zone-kind">${g.zone ? (g.zone.freeing ? T.zone.freeing : kindCaption(g.zone.kind)) : ''}</span>
        </h2>${g.items.map((i) => itemCard(i, now)).join('')}</section>`).join('');
  } else body = sortedItems(list, now).map((i) => itemCard(i, now)).join('');

  return `
    <a class="back-link" href="#home">${T.home.backThree}</a>
    <p class="kicker">${T.manage.kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.manage.title}</h1>
    ${scopeToggle}${disclosure}${movingBanner}${pauseBanner}${commonsBlock(now, inScope)}
    <div class="segmented four" role="radiogroup" aria-label="${T.manage.filterLabel}">${seg}</div>
    ${list.length ? `<p class="card-note">${T.manage.cardNote}</p>` : ''}
    <div class="item-list">${body}</div>
    ${state.scope === 'house' ? agreementsBlock() : ''}
    ${inScope.length && !pausedAll ? `<div class="actions single away">
      <button type="button" class="secondary" data-action="pause-all">${T.manage.pauseAll}</button></div>` : ''}
    <div class="actions single away">
      <button type="button" class="secondary" data-action="moveout-start">${T.moveOut.entry}</button></div>`;
}

function zoneGroups(list, now) {
  const groups = state.zones.map((z) => ({ zone: z, items: sortedItems(list.filter((i) => i.zone === z.id), now) }));
  const loose = sortedItems(list.filter((i) => !i.zone || !zoneById(i.zone)), now);
  if (loose.length) groups.push({ zone: null, items: loose });
  return groups.filter((g) => g.items.length);
}

/* ---------- F13 买菜前看一眼：只读，不改任何东西 ---------- */

function shopView() {
  const now = Date.now();
  const first = sortedItems(state.items.filter((i) => needsAttention(i, now) || i.plan === 'soon'), now).slice(0, 5);
  const counts = state.zones.map((z) => ({ z, n: state.items.filter((i) => i.zone === z.id).length }))
    .filter((r) => r.n > 0);
  return `
    <a class="back-link" href="#home">${T.home.backThree}</a>
    <p class="kicker">${T.shop.kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.shop.title}</h1>
    <section class="shop-block">
      <h2 class="shop-head">${T.shop.eatFirst}</h2>
      ${first.length ? first.map((i) => `
        <div class="shop-row">
          <span class="shop-name">${escapeHTML(i.description)}</span>
          <span class="chip chip-plan is-${planState(i, now)}">${T.plan[i.plan]}</span>
          <span class="age-line">${plural(T.house.ageOne, T.house.ageMany, ageDays(i, now))}</span>
        </div>`).join('') : `<p class="shop-empty">${T.shop.empty}</p>`}
    </section>
    <section class="shop-block">
      <h2 class="shop-head">${T.shop.already}</h2>
      ${counts.map((r) => `<div class="shop-row">
        <span class="shop-name">${escapeHTML(r.z.label)}</span>
        <span class="shop-count">${plural(T.shop.countOne, T.shop.countMany, r.n)}</span></div>`).join('')}
    </section>
    <section class="shop-block">
      <h2 class="shop-head">${T.shop.room}</h2>
      ${state.zones.map((z) => `<div class="shop-row">
        <span class="shop-name">${escapeHTML(z.label)}</span>
        <span class="chip ${z.full ? 'chip-unknown' : ''}">${z.full ? T.zone.full : T.zone.roomLeft}</span>
        <button type="button" class="mini" data-action="toggle-full" data-value="${z.id}">${z.full ? T.zone.markRoom : T.zone.markFull}</button>
        </div>`).join('')}
    </section>
    <p class="shop-note">${T.shop.note}</p>`;
}

/* ---------- F9 搬出交接 ---------- */

function moveOutView() {
  const now = Date.now();
  const M = state.moveOut || { step: 1, keep: {} };
  const mine = myItems();
  const handing = mine.filter((i) => !M.keep[i.id]);
  const back = `<button type="button" class="back-link as-button" data-action="moveout-cancel">${T.moveOut.cancel}</button>`;
  if (M.step === 1) {
    return `${back}<p class="kicker">${T.moveOut.step1Kicker}</p>
      <h1 id="route-title" tabindex="-1">${T.moveOut.step1Title}</h1>
      <p class="lede">${T.moveOut.step1Lede}</p>
      <div class="pick-list">${mine.map((i) => `
        <button type="button" class="pick-row ${M.keep[i.id] ? 'is-on' : ''}"
                data-action="moveout-toggle" data-value="${escapeHTML(i.id)}" aria-pressed="${!!M.keep[i.id]}">
          <span class="pick-box" aria-hidden="true">${M.keep[i.id] ? '✓' : ''}</span>
          <span class="pick-name">${escapeHTML(i.description)}</span>
          <span class="chip chip-zone">${escapeHTML(zoneLabel(i.zone))}</span>
        </button>`).join('')}</div>
      <div class="actions single"><button type="button" data-action="moveout-next"
        ${handing.length ? '' : 'disabled aria-disabled="true"'}>
        ${handing.length ? plural(T.moveOut.step1NextOne, T.moveOut.step1NextMany, handing.length) : T.moveOut.step1None}
      </button></div>`;
  }
  if (M.step === 2) {
    return `${back}<p class="kicker">${T.moveOut.step2Kicker}</p>
      <h1 id="route-title" tabindex="-1">${T.moveOut.step2Title}</h1>
      <div class="item-list">${handing.map((i) => `
        <article class="item-card"><h3>${escapeHTML(i.description)}</h3>
          <div class="item-meta"><span class="chip">${T.ownership[i.ownership]}</span>
          <span class="chip chip-offer">${T.manage.offer}</span>
          <span class="chip chip-zone">${T.manage.offerAlways}</span></div></article>`).join('')}</div>
      <p class="found-note">${T.moveOut.step2Note}</p>
      <div class="actions single"><button type="button" data-action="moveout-next">${T.moveOut.step2Next}</button></div>`;
  }
  if (M.step === 3) {
    const zs = state.zones.filter((z) => z.kind === 'own' || z.kind === 'cold');
    return `${back}<p class="kicker">${T.moveOut.step3Kicker}</p>
      <h1 id="route-title" tabindex="-1">${T.moveOut.step3Title}</h1>
      <div class="item-list">${zs.map((z) => `
        <article class="item-card"><h3>${escapeHTML(z.label)}</h3>
          <div class="item-meta"><span class="chip chip-unknown">${T.zone.freeing}</span></div></article>`).join('')}</div>
      <p class="found-note">${T.moveOut.step3Note}</p>
      <div class="actions single"><button type="button" data-action="moveout-finish">${T.moveOut.step3Done}</button></div>`;
  }
  const offered = state.items.filter((i) => isOffered(i, now));
  return `${back}<p class="kicker">${T.moveOut.step4Kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.moveOut.step4Title}</h1>
    <p class="local-only" role="note"><span class="local-only-mark" aria-hidden="true">!</span>${T.house.localOnly}</p>
    <p class="moving-banner">${T.moveOut.banner}</p>
    <section class="zone-group is-offer">
      <h2 class="zone-head"><span class="zone-name">${T.moveOut.freeToTake}</span></h2>
      ${offered.map((i) => `<article class="item-card"><h3>${escapeHTML(i.description)}</h3>
        <div class="item-meta"><span class="chip chip-offer">${T.manage.offer}</span>
        <span class="chip chip-zone">${offerLabel(i)}</span></div></article>`).join('')}
    </section>
    <p class="found-note">${T.moveOut.step4Note}</p>
    <div class="actions single"><a class="button-link" href="#manage" data-action="moveout-done">${T.moveOut.step4Done}</a></div>`;
}

/* ---------- F10 入住期房屋设置 ---------- */

function setupView() {
  const U = state.setup || { step: 1, zones: state.zones.map((z) => ({ ...z })), agreements: state.settings.agreements.slice() };
  if (U.step === 1) {
    return `<p class="kicker">${T.setup.step1Kicker}</p>
      <h1 id="route-title" tabindex="-1">${T.setup.step1Title}</h1>
      <p class="lede">${T.setup.step1Lede}</p>
      <div class="pick-list">${U.zones.map((z, i) => `
        <div class="draft-row"><span class="grip" aria-hidden="true">☰</span>
          <span class="draft-body"><input class="zone-input" type="text" maxlength="${MAX_DESCRIPTION}"
            data-setup-label="${i}" value="${escapeHTML(z.label)}" placeholder="${T.setup.placeHint}"></span>
          <button type="button" class="row-remove" data-action="setup-remove" data-value="${i}">✕</button>
        </div>`).join('')}</div>
      <div class="actions"><button type="button" class="secondary" data-action="setup-add">${T.setup.addPlace}</button></div>
      <div class="actions single"><button type="button" data-action="setup-next">${T.setup.next}</button></div>
      <div class="home-tools"><a class="text-link" href="#home" data-action="setup-skip">${T.setup.skip}</a></div>`;
  }
  if (U.step === 2) {
    return `<p class="kicker">${T.setup.step2Kicker}</p>
      <h1 id="route-title" tabindex="-1">${T.setup.step2Title}</h1>
      <div class="pick-list">${U.zones.map((z, i) => `
        <div class="draft-row"><span class="draft-body"><span class="draft-name">${escapeHTML(z.label)}</span></span>
          <button type="button" class="mini is-set" data-action="setup-kind" data-value="${i}">
            ${T.setup['kind' + z.kind.charAt(0).toUpperCase() + z.kind.slice(1)]} <span aria-hidden="true">▾</span>
          </button></div>`).join('')}</div>
      <p class="found-note">${T.setup.step2Note}</p>
      <div class="actions single"><button type="button" data-action="setup-next">${T.setup.next}</button></div>`;
  }
  const rows = [T.setup.agree1, T.setup.agree2, T.setup.agree3].map((t, i) => `
    <button type="button" class="pick-row ${U.agreements[i] ? 'is-on' : ''}" data-action="setup-agree"
            data-value="${i}" aria-pressed="${!!U.agreements[i]}">
      <span class="pick-box" aria-hidden="true">${U.agreements[i] ? '✓' : ''}</span>
      <span class="pick-name">${t}</span></button>`).join('');
  return `<p class="kicker">${T.setup.step3Kicker}</p>
    <h1 id="route-title" tabindex="-1">${T.setup.step3Title}</h1>
    <div class="pick-list">${rows}</div>
    <p class="found-note">${T.setup.step3Note}</p>
    <div class="actions single"><button type="button" data-action="setup-finish">${T.setup.done}</button></div>`;
}

/* ---------- render ---------- */

function renderChrome() {
  document.documentElement.lang = T._meta.htmlLang;
  document.title = T._meta.title;
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('disclosure-version', T.disclosure.version);
  set('disclosure-scope', T.disclosure.scope);
  set('brand-eyebrow', T.brand.eyebrow);
  set('brand-name', T.brand.name);
  set('footer-storage', T.footer.storage);
  set('footer-safety', T.footer.safety);
  set('footer-timing', T.footer.timing);
  set('footer-sync', T.footer.sync);
  const brand = document.getElementById('brand-link');
  if (brand) brand.setAttribute('aria-label', T.brand.backToHome);
  const reset = document.getElementById('reset-button');
  if (reset) { reset.title = T.reset.label; reset.setAttribute('aria-label', T.reset.label); }
  const lang = document.getElementById('lang-button');
  if (lang) { lang.textContent = T.lang.toggle; lang.title = T.lang.aria; lang.setAttribute('aria-label', T.lang.aria); }
}

function render({ focusHeading = false } = {}) {
  renderChrome();
  const route = getRoute();
  app.innerHTML = route === 'add' ? entryView(false)
    : route === 'found' ? entryView(true)
    : route === 'manage' ? manageView()
    : route === 'shop' ? shopView()
    : route === 'moveout' ? moveOutView()
    : route === 'setup' ? setupView()
    : homeView();
  app.insertAdjacentHTML('beforeend', photoViewer());
  if (focusHeading) document.getElementById('route-title')?.focus({ preventScroll: true });
}

function resetDemo() {
  if (!window.confirm(T.reset.confirm)) return;
  [STORAGE_KEY, FISH_KEY, ZONES_KEY, SETTINGS_KEY].forEach((k) => localStorage.removeItem(k));
  state.zones = loadZones();
  state.settings = loadSettings();
  state.items = initialItems();
  state.fish = loadFish();
  Object.assign(state, { draft: [], batchDefault: 'personal', batchZone: null, otherOpen: false,
    otherText: '', scope: 'mine', filter: 'all', editingId: null, pendingClearId: null,
    whoseFor: null, offerFor: null, moveOut: null, setup: null,
    photo: null, photoFor: null, viewingPhoto: null,
    spot: '', spotOtherOpen: false, spotOtherText: '' });
  render();
  showToast(T.reset.done);
}

/* ---------- actions ---------- */

const findItem = (id) => state.items.find((c) => c.id === id);
const findRow = (id) => state.draft.find((c) => c.tmpId === id);

function commitBatch(found) {
  if (!state.draft.length) return;
  const now = Date.now();
  const iso = new Date(now).toISOString();
  const fresh = state.draft.map((row, index) => ({
    id: `item-${now}-${index}`, description: row.description, ownership: row.ownership,
    plan: row.plan, planSetAt: row.plan === 'open' ? null : iso, zone: row.zone || null,
    ageBase: iso, openedAt: null, pausedAt: null, pausedMs: 0,
    holdUntil: null, handledAt: null, offerUntil: null,
    /* 一次记录＝站在一处。同批每一件都拿到同一个具体位置与同一张照片。 */
    spot: normaliseSpot(state.spot),
    photo: state.photo
  }));
  const n = fresh.length;
  state.items = fresh.concat(state.items);
  Object.assign(state, { draft: [], otherOpen: false, otherText: '', whoseFor: null,
                         photo: null, photoFor: null,
                         spot: '', spotOtherOpen: false, spotOtherText: '' });
  /* 无主物落在混合区，而「我的」视图按定义看不到混合区——记完就看不见自己刚记的那条，
     位置照片也就白拍了。所以这一步把范围切到「屋内」：那条记录本来就是给屋里人看的。 */
  if (found) state.scope = 'house';
  saveItems();
  window.location.hash = '#manage';
  showToast(found ? T.toast.noted : plural(T.toast.savedOne, T.toast.savedMany, n));
}

function handleAction(action, value) {
  /* ---- 语言 ---- */
  if (action === 'toggle-lang') {
    /* 只有「用户一件都没动过」时才把演示数据换成新语言的那一套。
       用户自己录入的描述是内容，不是界面文字，永远不翻译、不覆盖。 */
    const untouchedItems = state.items.length > 0 && state.items.every((i) => i.id.indexOf('demo-') === 0);
    const untouchedZones = !state.settings.setupDone
      && state.zones.every((z) => (T.demoZones || []).some((d) => d.id === z.id && d.label === z.label));
    LANG = LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length];
    T = S[LANG];
    localStorage.setItem(LANG_KEY, LANG);
    if (untouchedZones) { state.zones = loadZonesSeed(); saveZones(); }
    if (untouchedItems) { state.items = initialItems(); saveItems(); }
    state.editingId = null;
    state.pendingClearId = null;
    render();
    return;
  }

  if (action === 'quick-add' || action === 'found-add') {
    const [label, plan] = value.split('|');
    if (addDraft(label, action === 'found-add', plan)) render();
    return;
  }
  if (action === 'other-toggle') {
    state.otherOpen = !state.otherOpen; render();
    if (state.otherOpen) document.getElementById('other-input')?.focus();
    return;
  }
  if (action === 'other-commit' || action === 'found-commit') {
    if (addDraft(state.otherText, action === 'found-commit', 'open')) {
      state.otherText = ''; render(); document.getElementById('other-input')?.focus();
    }
    return;
  }
  if (action === 'other-cancel') { state.otherOpen = false; state.otherText = ''; render(); return; }
  if (action === 'row-remove') {
    state.draft = state.draft.filter((r) => r.tmpId !== value);
    render(); showToast(T.toast.rowRemoved); return;
  }
  if (action === 'row-ownership') { const r = findRow(value); if (r) { r.ownership = cycle(OWNERSHIP_KEYS, r.ownership); render(); } return; }
  if (action === 'row-plan') { const r = findRow(value); if (r) { r.plan = cycle(PLAN_KEYS, r.plan); render(); } return; }
  if (action === 'row-zone') {
    const r = findRow(value); if (!r) return;
    const ids = [null].concat(state.zones.map((z) => z.id));
    r.zone = ids[(ids.indexOf(r.zone) + 1) % ids.length];
    const kind = zoneKind(r.zone);
    if (kind === 'mixed' && r.ownership !== 'unknown') r.ownership = 'unknown';
    if (kind === 'cold') r.plan = 'open';
    render(); return;
  }
  if (action === 'whose-open') { state.whoseFor = value; render(); return; }
  if (action === 'row-set-owner') {
    const [tmpId, key] = value.split(':');
    const r = findRow(tmpId);
    if (r) { r.ownership = normaliseOwnership(key); state.whoseFor = null; render(); }
    return;
  }
  if (action === 'batch-default') {
    state.batchDefault = value;
    state.draft.forEach((r) => { if (zoneKind(r.zone) !== 'mixed') r.ownership = value; });
    render(); return;
  }
  if (action === 'batch-zone') {
    state.batchZone = state.batchZone === value ? null : value;
    state.draft.forEach((r) => {
      r.zone = state.batchZone;
      const kind = zoneKind(r.zone);
      if (kind === 'mixed') r.ownership = 'unknown';
      if (kind === 'cold') r.plan = 'open';
    });
    render(); return;
  }
  if (action === 'save-batch') { commitBatch(false); return; }
  if (action === 'save-found') { commitBatch(true); return; }

  if (action === 'set-scope') { state.scope = value; state.editingId = null; state.pendingClearId = null; render(); return; }
  if (action === 'set-filter') { state.filter = value; render(); return; }
  if (action === 'edit-item') { state.editingId = value; state.pendingClearId = null; render(); return; }
  if (action === 'cancel-update') { state.editingId = null; render(); return; }

  if (action === 'claim-item') {
    const i = findItem(value); if (!i) return;
    i.ownership = 'personal'; state.editingId = value;
    saveItems(); render(); showToast(T.toast.claimed); return;
  }
  /* 主语永远是「有人」。不记录是谁挂的，也不记录是谁点的「先别动」。 */
  if (action === 'hold-item') {
    const i = findItem(value); if (!i) return;
    i.holdUntil = new Date(Date.now() + HOLD_MS).toISOString();
    saveItems(); render(); showToast(T.toast.held); return;
  }
  if (action === 'release-hold') {
    const i = findItem(value); if (!i) return;
    i.holdUntil = null; saveItems(); render(); showToast(T.toast.holdReleased); return;
  }
  if (action === 'mark-opened') {
    const i = findItem(value); if (!i) return;
    const iso = new Date().toISOString();
    /* 失效点是开封，不是购买——计划从这一刻重新起算。 */
    i.openedAt = iso; i.planSetAt = iso; i.pausedMs = 0;
    if (i.plan === 'open') i.plan = 'soon';
    saveItems(); render(); showToast(T.toast.openedDone); return;
  }
  /* F7 放进冷冻＝取消当前计划。界面一个字都不说冷冻能放多久。 */
  if (action === 'to-freezer') {
    const i = findItem(value); const cold = firstColdZone();
    if (!i || !cold) return;
    i.zone = cold.id; i.plan = 'open'; i.planSetAt = null; i.pausedAt = null; i.pausedMs = 0;
    saveItems(); render(); showToast(T.toast.frozen); return;
  }
  if (action === 'thaw-item') {
    const i = findItem(value); if (!i) return;
    i.zone = null; state.editingId = value;
    saveItems(); render(); showToast(T.toast.thawed); return;
  }
  /* F8 开放取用不改 ownership：共用＝这是大家的；可以拿＝这是我的，但现在你可以拿。 */
  if (action === 'offer-open') { state.offerFor = value; render(); return; }
  if (action === 'offer-set') {
    const [id, span] = value.split(':');
    const i = findItem(id); if (!i) return;
    i.offerUntil = span === OFFER_ALWAYS ? OFFER_ALWAYS
      : new Date(Date.now() + (span === 'two' ? 2 * DAY_MS : DAY_MS)).toISOString();
    state.offerFor = null;
    saveItems(); render(); showToast(T.toast.offered); return;
  }
  if (action === 'offer-stop') {
    const i = findItem(value); if (!i) return;
    i.offerUntil = null; saveItems(); render(); showToast(T.toast.offerStopped); return;
  }

  if (action === 'pause-all') {
    const iso = new Date().toISOString();
    scopeItems().forEach((i) => { if (!i.pausedAt) i.pausedAt = iso; });
    saveItems(); render(); showToast(T.toast.pausedAll); return;
  }
  if (action === 'resume-all') {
    const now = Date.now();
    state.items.forEach((i) => {
      if (i.pausedAt) { i.pausedMs = (i.pausedMs || 0) + (now - Date.parse(i.pausedAt)); i.pausedAt = null; }
    });
    saveItems(); render(); showToast(T.toast.resumedAll); return;
  }
  if (action === 'resume-item') {
    const i = findItem(value); if (!i || !i.pausedAt) return;
    i.pausedMs = (i.pausedMs || 0) + (Date.now() - Date.parse(i.pausedAt));
    i.pausedAt = null; saveItems(); render(); return;
  }
  if (action === 'toggle-full') {
    const z = zoneById(value); if (!z) return;
    z.full = !z.full; saveZones(); render(); return;
  }

  if (action === 'update-item') {
    const i = findItem(value); if (!i) return;
    const owner = document.querySelector(`[data-edit-ownership="${CSS.escape(value)}"]`);
    const plan = document.querySelector(`[data-edit-plan="${CSS.escape(value)}"]`);
    const zone = document.querySelector(`[data-edit-zone="${CSS.escape(value)}"]`);
    const spot = document.querySelector(`[data-edit-spot="${CSS.escape(value)}"]`);
    if (owner) i.ownership = normaliseOwnership(owner.value);
    if (zone) i.zone = zone.value || null;
    if (spot) i.spot = normaliseSpot(spot.value);
    if (plan) {
      const next = normalisePlan(plan.value);
      if (next !== i.plan) { i.plan = next; i.planSetAt = next === 'open' ? null : new Date().toISOString(); i.pausedMs = 0; }
    }
    state.editingId = null; saveItems(); render(); showToast(T.toast.updated); return;
  }
  if (action === 'clear-item') { state.pendingClearId = value; state.editingId = null; render(); return; }
  if (action === 'cancel-clear') { state.pendingClearId = null; render(); return; }
  if (action === 'confirm-clear') {
    const now = Date.now();
    const i = findItem(value);
    const earned = i ? needsAttention(i, now) : false;
    if (i && (i.ownership === 'unknown' || i.holdUntil)) {
      /* 回执 48 小时后自动消失——永久的「谁处理了什么」就是行为历史。 */
      i.handledAt = new Date(now).toISOString(); i.holdUntil = null;
    } else state.items = state.items.filter((c) => c.id !== value);
    state.pendingClearId = null; saveItems();
    if (earned) { state.fish.count += 1; state.fish.last = new Date(now).toISOString(); saveFish(); }
    render(); showToast(earned ? T.toast.fishEarned : T.toast.cleared); return;
  }

  /* ---- F9 搬出交接 ---- */
  if (action === 'moveout-start') { state.moveOut = { step: 1, keep: {} }; window.location.hash = '#moveout'; return; }
  if (action === 'moveout-cancel') { state.moveOut = null; window.location.hash = '#manage'; return; }
  if (action === 'moveout-toggle') {
    const M = state.moveOut; if (!M) return;
    M.keep[value] = !M.keep[value]; render(); return;
  }
  if (action === 'moveout-next') { const M = state.moveOut; if (!M) return; M.step += 1; render(); return; }
  if (action === 'moveout-finish') {
    const M = state.moveOut; if (!M) return;
    /* 步骤 2 复用开放取用，时限「一直可以」——人已经走了，没人能再来改时限。
       不改 ownership：可以共享不等于转移所有权。 */
    myItems().forEach((i) => { if (!M.keep[i.id]) i.offerUntil = OFFER_ALWAYS; });
    state.zones.forEach((z) => { if (z.kind === 'own' || z.kind === 'cold') z.freeing = true; });
    state.settings.movingOut = true;
    M.step = 4;
    saveItems(); saveZones(); saveSettings(); render(); showToast(T.toast.handedOver); return;
  }
  if (action === 'moveout-done') { state.moveOut = null; state.scope = 'house'; return; }

  /* ---- F10 房屋设置 ---- */
  if (action === 'setup-add') {
    const U = state.setup; if (!U) return;
    U.zones.push({ id: `z${Date.now()}`, kind: 'own', label: '', full: false, freeing: false });
    render(); return;
  }
  if (action === 'setup-remove') {
    const U = state.setup; if (!U) return;
    U.zones.splice(Number(value), 1); render(); return;
  }
  if (action === 'setup-kind') {
    const U = state.setup; if (!U) return;
    const z = U.zones[Number(value)];
    if (z) { z.kind = cycle(ZONE_KINDS, z.kind); render(); }
    return;
  }
  if (action === 'setup-next') {
    const U = state.setup; if (!U) return;
    if (U.step === 1) U.zones = U.zones.filter((z) => String(z.label).trim());
    U.step += 1; render(); return;
  }
  if (action === 'setup-agree') {
    const U = state.setup; if (!U) return;
    const i = Number(value); U.agreements[i] = !U.agreements[i]; render(); return;
  }
  if (action === 'setup-skip') { state.setup = null; return; }
  if (action === 'setup-finish') {
    const U = state.setup; if (!U) return;
    state.zones = U.zones.filter((z) => String(z.label).trim())
      .map((z) => ({ id: z.id, kind: z.kind, label: String(z.label).trim().slice(0, MAX_DESCRIPTION),
                     full: z.full === true, freeing: z.freeing === true }));
    state.settings.agreements = U.agreements.slice(0, 3).map((v) => v === true);
    state.settings.setupDone = true;
    state.setup = null;
    saveZones(); saveSettings();
    window.location.hash = '#home';
    showToast(T.toast.setupDone); return;
  }

  /* ---- 具体位置 ---- */
  if (action === 'spot-pick') {
    state.spot = state.spot === value ? '' : value;
    state.spotOtherOpen = false;
    render(); showToast(state.spot ? T.spot.set : T.spot.cleared); return;
  }
  if (action === 'spot-clear') {
    state.spot = ''; state.spotOtherText = ''; state.spotOtherOpen = false;
    render(); showToast(T.spot.cleared); return;
  }
  if (action === 'spot-other-toggle') {
    state.spotOtherOpen = !state.spotOtherOpen;
    if (state.spotOtherOpen) state.spotOtherText = T.spot.picks.includes(state.spot) ? '' : state.spot;
    render();
    if (state.spotOtherOpen) document.getElementById('spot-input')?.focus();
    return;
  }
  if (action === 'spot-other-cancel') { state.spotOtherOpen = false; render(); return; }
  if (action === 'spot-other-commit') {
    const text = normaliseSpot(state.spotOtherText);
    if (!text) { showToast(T.toast.needDescription); return; }
    state.spot = text; state.spotOtherOpen = false;
    render(); showToast(T.spot.set); return;
  }

  /* ---- 位置照片 ---- */
  if (action === 'photo-take' || action === 'photo-choose') {
    state.photoFor = null;
    openPhotoInput(action === 'photo-take'); return;
  }
  if (action === 'photo-add') {
    if (!findItem(value)) return;
    state.photoFor = value;
    openPhotoInput(true); return;
  }
  if (action === 'photo-remove') { state.photo = null; render(); showToast(T.photo.removed); return; }
  if (action === 'photo-drop') {
    const item = findItem(value); if (!item) return;
    item.photo = null; saveItems(); render(); showToast(T.photo.removed); return;
  }
  if (action === 'photo-open') { state.viewingPhoto = value; render(); return; }
  if (action === 'photo-close') { state.viewingPhoto = null; render(); return; }

  if (action === 'reset-demo') resetDemo();
}

/* 两个 input 一直躺在 shell 里，不随重绘消失，change 监听器也就只需要挂一次。
   capture="environment" 让手机直接开后置相机——站在冰箱前少一步。 */
function openPhotoInput(camera) {
  document.getElementById(camera ? 'photo-camera' : 'photo-library')?.click();
}

document.addEventListener('input', (event) => {
  if (event.target.id === 'other-input') {
    state.otherText = event.target.value;
    const counter = app.querySelector('.other-panel .counter');
    if (counter) counter.textContent = T.add.counter.replace('{n}', state.otherText.length).replace('{max}', MAX_DESCRIPTION);
  }
  if (event.target.id === 'spot-input') state.spotOtherText = event.target.value;
  const idx = event.target.getAttribute && event.target.getAttribute('data-setup-label');
  if (idx !== null && idx !== undefined && state.setup) {
    const z = state.setup.zones[Number(idx)];
    if (z) z.label = event.target.value;
  }
});

document.addEventListener('change', async (event) => {
  if (event.target.id !== 'photo-camera' && event.target.id !== 'photo-library') return;
  const file = event.target.files && event.target.files[0];
  event.target.value = '';                 // 清空才能连着选同一张
  const target = state.photoFor;
  state.photoFor = null;
  if (!file) return;
  let data;
  try { data = await readPhoto(file); } catch (error) { showToast(T.photo.failed); return; }
  if (target) {
    const item = findItem(target);
    if (!item) return;
    item.photo = data;
    /* saveItems 写不下时会自己说明照片没留下，这里就别再报一次「已附上」。 */
    let saved = false;
    try { saved = saveItems(); } catch (error) { showToast(T.photo.tooLarge); }
    if (saved) showToast(T.photo.added);
  } else {
    state.photo = data;
    showToast(T.photo.added);
  }
  render();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && state.viewingPhoto) {
    state.viewingPhoto = null; render(); return;
  }
  if (event.target.id === 'spot-input' && event.key === 'Enter') {
    event.preventDefault(); handleAction('spot-other-commit', ''); return;
  }
  if (event.target.id === 'other-input' && event.key === 'Enter') {
    event.preventDefault();
    handleAction(getRoute() === 'found' ? 'found-commit' : 'other-commit', '');
  }
});

document.addEventListener('click', (event) => {
  const control = event.target.closest('[data-action]');
  if (!control) return;
  handleAction(control.dataset.action, control.dataset.value || '');
});

window.addEventListener('hashchange', () => {
  const route = getRoute();
  state.viewingPhoto = null;
  if (route === 'moveout' && !state.moveOut) state.moveOut = { step: 1, keep: {} };
  if (route === 'setup' && !state.setup) {
    state.setup = { step: 1, zones: state.zones.map((z) => ({ ...z })), agreements: state.settings.agreements.slice() };
  }
  render({ focusHeading: true });
});

render();
if (storageRecovered) showToast(T.toast.recovered);
</script>
</body>
</html>
